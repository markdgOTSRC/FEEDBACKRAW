 place at the day one. Gold clock and Silver clock. I waited at the wrong clock. And I failed meeting my team. Fortunately I could catch my team. You may hear the story from Willy."], ["John Evans", "Camino (Spain)", 4, "04 Jun", "Constructive", ["Accommodation"], "You should never had Hotel Parque inn your accommodation list"], ["James Rutherford", "UK (Cornish Camino)", 4, "04 Jun", "Constructive", ["Accommodation"], "Provide consistent accommodation provders"], ["Eva Maria Eriksson-Nordstrom", "UK (Coast to Coast)", 4, "03 Jun", "Constructive", ["Other / General"], "Clearer on how things worked at the start the rest flowed"], ["Gail Hay", "Puglia (Italy)", 4, "03 Jun", "Constructive", ["App & Navigation", "Accommodation"], "The Travel App only got us to the town, from there we had to use Google Maps to locate hotel"], ["Barry Rawicki", "Michinoku Coastal Trail (Japan)", 5, "03 Jun", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The interactive maps, esp the elevation was poor compared to Auswalks and All Trails which show where you are on the elevation, how far you\u2019ve come and how far to go. This info was either missing or too difficult to find"], ["Ali Couper", "Camino (Portugal)", 5, "03 Jun", "Constructive", ["App & Navigation"], "mapping was hard to follow at times, should have been more specific to our trip not just general"], ["Wendy Creaser", "Camino (Spain)", 4, "03 Jun", "Negative", ["App & Navigation"], "App was a little annoying as you have to go back to the start of the app too often"], ["Angela Sabato", "Nakasendo Way (Japan)", 5, "03 Jun", "Negative", ["Other / General"], "Our only frustration was 3 days were as shortened due to slow walkers, we would have liked an option to do the full trek."], ["Doug Hay", "Puglia (Italy)", 4, "02 Jun", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy"], "Better more accurate app - many inaccuracies / better pre trip information"], ["Monica Holly", "Nakasendo Way (Japan)", 5, "01 Jun", "Positive", ["No improvement needed"], "No"], ["David Whittle", "Camino (Portugal)", 4, "31 May", "Negative", ["Local Support & Communication", "Guides & Group"], "We weren't on the mailing list consistently and this created an issue when my wife Catherine Birman was injured and was arriving ahead of the group.  As this problem had already been flagged a number of times, very frustrating.  The local support person never emailed us (even when this issue arose) and so his usefulness was limited"], ["David Holly", "Nakasendo Way (Japan)", 5, "31 May", "Constructive", ["Accommodation", "Pre-Trip Planning"], "A final phone call before we departed, to check in with us."], ["Pam Zeller", "Puglia (Italy)", 4, "31 May", "Negative", ["Other / General"], "Cooking classes not fun and we only rolled pasta not cooking at all"], ["Peter Lotz", "Camino (Spain)", 5, "31 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Food & Meals", "Luggage & Transfers", "Pre-Trip Planning"], "The app content needs to be updated when it comes to the accommodation eg.  Sometimes the hotel name has changed, availability of supper is generally better than stated for \"off camino hotels\".  I never had to make an advance reservation for a meal.  Shuttle arrangements are more flexible than stated in the app....happy to share details when it suits"], ["Jennie Porter", "Camino (France)", 4, "31 May", "Positive", ["No improvement needed"], "No"], ["Helen Astell", "Kumano Kodo (Japan)", 5, "30 May", "Constructive", ["Accommodation"], "Other than the points I have already mentioned, I was very pleased with my RAW Experience. This is the first time I have used a walking tour company. I found Dianne very helpful  and responsive when we were organising the trip, and she suggested staying in Wakyama after flying in from Australia. We stayed in the hotel overlooking to the castle, am amazing way to start our holiday before the walk started... maybe you should offer that as an option."], ["Jo De Bruyn", "Camino (France)", 4, "30 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Luggage & Transfers"], "Yes When planning the distances between accommodation I don\u2019t think this was well done on 2 of the stages Saugese to Les Klause and from Estaing to Golinach These distances were 2 short I was told there was no accommodation between Saugues and Les Faux but there was a lot that we saw. Also I think the distance to be covered each day should be on the itinerary app"], ["Lina Battisti", "Via Francigena (Italy)", 5, "29 May", "Positive", ["No improvement needed"], "No it was all very good!"], ["Robert Chionna", "Camino (France)", 4, "29 May", "Constructive", ["Other / General"], "We did not feel that some of the accomodation met or resblemled some of the brochures or your publications."], ["FIONA Beith", "Nakasendo Way (Japan)", 5, "29 May", "Constructive", ["Itinerary & Route Info Accuracy"], "I would have liked more route info in written form as I don\u2019t like constantly looking at my phone."], ["Karen Stock", "Camino (France)", 5, "28 May", "Positive", ["Other / General"], "Everything was great, thank you"], ["Andrew Verdouw", "Nakasendo Way (Japan)", 5, "28 May", "Negative", ["Value & Pricing"], "Ensure that times a reasonable. Missing the tour as mentioned above was really disappointing and we felt that we had wasted money. As we are retired this is particularly important."], ["Kerry Sharrock", "Camino (Portugal)", 5, "28 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "More information on the app relating to distances between stops would have been helpful"], ["Janis Redford", "Puglia (Italy)", 4, "28 May", "Constructive", ["App & Navigation"], "A different Navigation App."], ["Peter Kon", "Camino (Spain)", 5, "27 May", "Positive", ["No improvement needed"], "No"], ["Sally Kelman", "Kumano Kodo (Japan)", 4, "27 May", "Constructive", ["Accommodation", "Value & Pricing"], "We requested single rooms which should have been possible in the larger accommodations but wasn\u2019t provided. We did pay a single supplement."], ["Lisa Young", "Kumano Kodo (Japan)", 5, "27 May", "Positive", ["No improvement needed"], "Not really - everything was great"], ["Karen Kon", "Camino (Spain)", 4, "27 May", "Positive", ["No improvement needed"], "No"], ["Caroline Lock", "Kumano Kodo (Japan)", 5, "27 May", "Constructive", ["Itinerary & Route Info Accuracy"], "Minor discrepancies between the day by day information and the Itinerary document"], ["Heidi Auman", "Michinoku Coastal Trail (Japan)", 5, "27 May", "Positive", ["Other / General"], "No, you surpassed all expectations, and we have already many amazing trips with you!"], ["Jill Gregory", "UK (Coast to Coast)", 5, "27 May", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Guides & Group"], "The app - I didn\u2019t understand the difference between Routes Map and Your Routes, also Your Routes is not shown in chronological order, so difficult to know when to use this feature. At times there were discrepancies between the app, the guide book and the sign posts on the track."], ["robertimilliner", "Norway (St Olav)", 4, "26 May", "Constructive", ["Itinerary & Route Info Accuracy"], "just a note - 2 sections have a lot of trees over the track and you have to be prepared for making your own detours"], ["Melinda Ross", "Camino (Spain)", 4, "26 May", "Constructive", ["Other / General"], "Some suggestions of places to stop along the way would have been really great, we had some good experiences but also some really bad. Some suggestions would have been really appreciated"], ["Mark Lourey", "Michinoku Coastal Trail (Japan)", 5, "26 May", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation"], "Our accommodation was wrong on app. I think our app was out of date. Also need to advise to take own toiletries to the public Onsen whilst glamping."], ["Marcus Kennedy", "Nakasendo Way (Japan)", 5, "26 May", "Constructive", ["Accommodation", "Food & Meals"], "Although we really enjoyed the Ryokan experience, the food options became repetitive and excessive, with huge breakfasts not really necessary. Would encourage a different breakfast option, better suited to a day of walking eg complex carbs / fruit."], ["Tarn Wiley", "Camino (Spain)", 5, "26 May", "Constructive", ["Accommodation", "Local Support & Communication"], "Sometimes just being in hotels can be isolating. Ask people if they would like accommodation at the albergues intermittently through the walk. On first day from sjpdp definitely book Borda albergues so people can meet others to walk with from the instart as it can be hard to make friends later in the Camino and can be abit isolating. But this is dependent on the different people that ask for your service and it would be great to be asked about what they want to get out do the trip in the way of being on their own or meeting others along the way. But you guys are awesome."], ["Sophie Lappin", "Camino (Spain)", 5, "25 May", "Constructive", ["Itinerary & Route Info Accuracy", "Luggage & Transfers", "Value & Pricing"], "With regards to the baggage restrictions, maybe making allowing an option to upgrade or pay for an extra bag that would go from the first departure to Santiago (and not needed on the way). This would have been very helpful with planning and travelling to further destinations. I understand this may have been an option, but it wasn\u2019t clearly shown in the pre departure information."], ["Joanne Wholohan", "Slovenia", 5, "25 May", "Constructive", ["Accommodation"], "I don\u2019t think so, one suggestion was perhaps staying at the one place for 2 nights for people to catch h their breath"], ["Anne GIUGNI", "Camino del Norte (Spain)", 5, "25 May", "Constructive", ["App & Navigation", "Local Support & Communication"], "The app is a great support but sometimes the diversion and choices can be confusing    Continued work on refining the app would be my suggestion"], ["Helen Geary", "Nakasendo Way (Japan)", 5, "25 May", "Constructive", ["Accommodation"], "See comment re ryokan in OTsumago"], ["SUSAN RADLEY", "Camino (Spain)", 4, "25 May", "Negative", ["App & Navigation"], "Compared to other walkers the RAW travel app was disappointing"], ["Anne Butler", "Arran (Scotland)", 5, "25 May", "Negative", ["Luggage & Transfers"], "Bus times on Arran weren\u2019t as easy as expected. We had a few problems in that area"], ["Nicholas Joannides", "Nakasendo Way (Japan)", 5, "24 May", "Negative", ["Itinerary & Route Info Accuracy"], "The route includes too many days of streets and roads"], ["David Andrews", "UK (South West Coast Path)", 4, "24 May", "Negative", ["Accommodation", "Food & Meals", "Luggage & Transfers", "Value & Pricing"], "If only accommodation available is 2 star and particularly 2 star 2 kilometres from restaurants give a warning and the option to walk further or take a bus or the option to pay more."], ["Val Lawler", "Camino (Spain)", 5, "24 May", "Constructive", ["Accommodation", "Weather, Safety & Conditions"], "I needed more guidance on actual kms per day from hotel to hotel.  Walking to Akerreta was an unexpected 30km day in pouring rain which l was terrible with my 80y/o Mum."], ["Margret Sockhill", "UK (Cotswolds)", 5, "24 May", "Constructive", ["Itinerary & Route Info Accuracy", "Local Support & Communication", "Luggage & Transfers"], "The bus and taxi transport options  were very  helpful. I think even more info could be added. I will speak to Lee Ann about it by email."], ["Jacobus Bronkhorst", "Camino (Spain)", 4, "23 May", "Positive", ["No improvement needed"], "No"], ["Nicki Scholes-Robertson", "Camino (Spain)", 5, "23 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "we had a slight issue with the RAW app when it was being updated for a few days but this resolved."], ["Gloria Brown", "Slovenia", 5, "22 May", "Positive", ["No improvement needed"], "No"], ["Malcolm Thomas", "Puglia (Italy)", 4, "22 May", "Negative", ["Other / General"], "not use Guido\u2014it was hopeless"], ["Patricia Wilson", "Nakasendo Way (Japan)", 5, "22 May", "Constructive", ["Weather, Safety & Conditions"], "We were so pleased to be able to achieve this walk. Perfect weather helped!"], ["Paul McNamara", "UK (Cornish Camino)", 4, "21 May", "Constructive", ["Other / General"], "Maybe"], ["Vince Hardy", "Slovenia", 5, "20 May", "Positive", ["No improvement needed"], "No"], ["Mary Walsh", "UK (Cotswolds)", 5, "20 May", "Negative", ["App & Navigation", "Food & Meals"], "It would have been good to know there were times when the app did not match the Cotswold Way markers (generally when there was a quicker way to enter a village). Once we understood the app was most helpful in getting us into the village for coffee/toilets/food.As beginers once we understood we were no longer confused."], ["Graham Cole", "Slovenia", 5, "20 May", "Constructive", ["Other / General"], "All ok."], ["Trevor Chudleigh", "Slovenia", 5, "20 May", "Constructive", ["Accommodation", "Guides & Group"], "Shared accommodation with strangers in a \u2018hut\u2019 with insufficient amenity is a deal breaker for me. I would not travel with Raw Travel if that were on any future trip plan. Our group of 12 had two groups of two couples. This effectively makes these sub-groups self sufficient from an interaction perspective without the need to make an effort to get to know others in the group. Our group of 12 was pleasant but cliquey."], ["Margaret McLoughlin", "Nakasendo Way (Japan)", 5, "20 May", "Constructive", ["Other / General"], "It all worked out so comfortably and easily so have no reasons to complain."], ["Lauren Finestone", "Kumano Kodo (Japan)", 5, "20 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Guides & Group"], "I didn't acytually need the route guides on this trail, but when I looked that them I didn't find them very helpful. It would be better to have something like the AllTrails maps that show you your actual route and where you are along it."], ["Frances Totney", "Camino (Spain)", 5, "20 May", "Positive", ["No improvement needed"], "Not that I can think of"], ["Robin Craig", "Camino (Portugal)", 5, "20 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation"], "One of our party became good at using the app to navigate so we relied on him.  A friend gave us her RAW travel book from 2 years ago and we all thought that was better than using the app but we definitely need the app to find our way to accommodation in the towns.  On the app it would have been good if the day by day entries included the distance.  Also the track notes were a bit vague in parts.  More info like 'At 6kms you will see blah blah' or \"At 7kms you will reach a junction of two paths\" - something like that would be good."], ["Helen Van Gessel", "UK (South West Coast Path)", 5, "18 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Guides & Group"], "Improve current route guidance in app - shouldn\u2019t need guide book as well; link app to more points of interest / information sites including possibly the SWCP site"], ["Robert Cameron", "Camino (Spain)", 4, "18 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation"], "Fix your App. Whilst the Camino is easy to follow the app doesn\u2019t always follow the trail. Daily schedule including distances etc and altitudes need to be included along with some notes on places visited would be great. Also management of getting to hotels when they are not on the trail also would be worthwhile especially when the are a fair distance away. Accommodation was outstanding and a highlight."], ["Peter Ledwinka", "Camino (Spain)", 5, "18 May", "Negative", ["Other / General"], "I\u2019m finding it difficult to offer anything that could have improved this experience. I\u2019m hoping to return soon and use your services again! I have spoken highly to friends and believe that they have booked your services for next April."], ["Murray Saint", "Nakasendo Way (Japan)", 4, "18 May", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Luggage & Transfers", "Weather, Safety & Conditions"], "The app was terrible. It would drop out. Information was basic. Info on trains and buses was unhelpful at times. We had to do a lot of figuring out ourselves. The app should show elevation each day and as you proceed long the day. It should give you distance travelled and howvfar to go each day. Having to log in every to e you wanted to use the app was painful. Even after having looked at 5 minutes ago you would then havebto log back in. A truly awful app."], ["Colleen Braithwaite", "Camino (Spain)", 5, "18 May", "Constructive", ["Accommodation", "Food & Meals", "Value & Pricing"], "Improve some hotels mentioned and everything would be perfect. People will pay a bit more.  Our other friends stayed at a wonderful hotel in O Pedrozo easy to get dinner etc."], ["Brodwyn Blyth", "UK (Cotswolds)", 5, "18 May", "Negative", ["App & Navigation"], "The app let me down on a number of occasions. Very disappointing and disconcerting. Needs improving."], ["Leone Smyth", "Camino (Spain)", 5, "17 May", "Positive", ["No improvement needed"], "No"], ["Kate Deakin", "Kumano Kodo (Japan)", 5, "17 May", "Positive", ["Other / General"], "It was amazing, thank you!  This is our third RAW trip and will not be our last."], ["Karen Fisher", "Kumano Kodo (Japan)", 5, "17 May", "Constructive", ["Accommodation", "Food & Meals"], "It was a wonderful experience. Generally, I would suggest not to put specific breakfast and dinner times, rather ask the host as they were mostly different from what was written.. I would definitely recommend to stay in Kii Tanabe"], ["Gary Brady", "Kumano Kodo (Japan)", 5, "16 May", "Constructive", ["Luggage & Transfers"], "Ask more about personal fitness to help determine schedule. For example the plan had us walking 17km one day and then catching a bus. We walked the 27km without issue."], ["Melanie Gunter", "Norway (St Olav)", 5, "13 May", "Positive", ["Other / General"], "Excellent"], ["Wendy Wells", "Camino (France)", 4, "12 May", "Positive", ["No improvement needed"], "No. Had a fantastic trip thanks."], ["Janis Redford", "Slovenia", 5, "11 May", "Constructive", ["Food & Meals"], "St Daniel only offered a 4 course meal for 35 euro. It would have been nice to have a smaller option e.g. 2 courses."], ["Tanya Shannon", "Camino (Spain)", 5, "11 May", "Positive", ["Other / General"], "Our experience was great. Very glad we went early in season. I feel that track gets very busy."], ["Jenny Clarke", "Nakasendo Way (Japan)", 5, "11 May", "Positive", ["No improvement needed"], "no"], ["Nicolla Lewin", "Kumano Kodo (Japan)", 5, "11 May", "Constructive", ["Other / General"], "No. I would highly recommend this style of travel to my friends and family."], ["Bryan Raymond", "UK (Coast to Coast)", 5, "10 May", "Positive", ["No improvement needed"], "Nothing comes to mind."], ["Rebecca Arnaud", "Australia", 5, "10 May", "Positive", ["No improvement needed"], "No"], ["Wyn Janssen", "UK (South West Coast Path)", 5, "09 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Weather, Safety & Conditions"], "As I mentioned two accommodations were a fair distance off the track but were good, a bit more information about some of the more challenging sections of the path would also be useful. I know that there are books but if this could be included in the App that would help. We used AllTrails a fair bit as it provided more information on distances and terrain we were to traverse."], ["Carey Cuneo", "New Zealand", 5, "06 May", "Positive", ["No improvement needed"], "Not really. Nothing was left to chance."], ["Helen Aldersey", "New Zealand", 4, "06 May", "Constructive", ["Guides & Group"], "The pace set by our guide was rather quick."], ["Darren Tuohy", "Camino (Portugal)", 4, "06 May", "Constructive", ["Other / General"], "Response from local agent"], ["Sarma Forde", "UK (Hadrians Wall)", 5, "05 May", "Constructive", ["App & Navigation"], "On the app ist thier a way to give distace to go"], ["Ann Woodrup", "UK (Coast to Coast)", 4, "05 May", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation", "Luggage & Transfers", "Weather, Safety & Conditions"], "1. Clear information concerning catching the train from Kirkby Stephen (a common halfway point for many people); the train is at least a 40 minute walk from the village (more with luggage). 2. Since I was travelling from UK to Australia after a month holiday I had luggage which I had calculated to just below 20 kg(allowed for transport between accommodation); at the beginning I weighed it at 18 kg and when I checked in at the airport at the end it was 18.5 kg, however on day 6 I was tagged as having 22 kg with suggestion of paying a supplement. Please check this discrepancy! 3. More warning that some of the smaller towns do not have shops to buy picnic supplies for the demanding walking distances. 4. Please check the taxi services if having to backtrack to Ennerdale bridge to Cleater...2 taxis we phoned were not able to pick us up and the 3 Rd demanded cash with no receipt."], ["Fiona Macliver", "UK (Coast to Coast)", 5, "04 May", "Constructive", ["App & Navigation", "Guides & Group"], "We had a wonderful trip and loved the guide we had ( Rachel) for day 3\u2026just had a bit of trouble with the maps"], ["Sam Stitt", "Kumano Kodo (Japan)", 5, "04 May", "Positive", ["No improvement needed"], "no it was seamless"], ["Dominique Cameron", "New Zealand", 5, "04 May", "Positive", ["No improvement needed"], "No"], ["Leitha Scott", "Australia", 5, "04 May", "Constructive", ["Itinerary & Route Info Accuracy", "Local Support & Communication", "Luggage & Transfers"], "No. Jenny, our support person, was excellent. She provided useful local information, additional offering in the area and very punctual in daily drop off and pick up"], ["David Barnes", "Via Francigena (Italy)", 4, "04 May", "Negative", ["Value & Pricing"], "Each location we checked into did not recognize us as RAW Travel but S Cape who I assumed you act as a reseller. I think the issue you have is when more travelers look at S Cape pricing for the identical holiday it is $2,000 cheaper per couple. It has made us think whether we should just book with SCape next time as RAW did not add $2,000 extra value."], ["Mary  Holmes", "Arran (Scotland)", 5, "04 May", "Positive", ["No improvement needed"], "No"], ["Caroline Currie", "Nakasendo Way (Japan)", 5, "03 May", "Constructive", ["Local Support & Communication", "Luggage & Transfers", "Weather, Safety & Conditions"], "Maybe a little more freedom and time to stop where we wanted on way as always meeting time deadlines for trains etc which perhaps could have been later"], ["Peter Whelan", "Camino (Spain)", 5, "03 May", "Constructive", ["Itinerary & Route Info Accuracy", "Luggage & Transfers"], "Taxi info for relevant locations"], ["Jane Kelynack", "New Zealand", 5, "03 May", "Positive", ["No improvement needed"], "No"], ["GEOFFREY   KERRY", "Camino (Portugal)", 4, "03 May", "Constructive", ["Other / General"], "Cut back the length of days 1 and 3 and/or spread them better."], ["Andrew Massey", "Kumano Kodo (Japan)", 4, "02 May", "Positive", ["No improvement needed"], "Nope - it was good"], ["Andrew Massey", "Kumano Kodo (Japan)", 4, "02 May", "Positive", ["No improvement needed"], "Nope - it was good"], ["Sue Caldicott", "Nakasendo Way (Japan)", 4, "02 May", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation", "Food & Meals", "Local Support & Communication", "Luggage & Transfers", "Pre-Trip Planning", "Value & Pricing", "Weather, Safety & Conditions"], "1. Day 1 lunch - the notes said we had the option to prebuy for a picnic lunch or buy on the trail. When we turned up at the meeting spot we were told we needed lunch! We had not bought ours so we then needed to get something quickly at the train station when we had all afternoon the previous day to organise it. 2. Trip notes could have advised us that we would not need clothes to change into after our hiking and for evening meals - we wore yakatas and samue provided every night - this would have saved some packing weight not having to bring changes of clothing. 3. Would have really appreciated some fruit in the mornings and to take on hikes. 4. There was an extra 3km walk after we arrived at our accommodation that was a total waste of time as we did not get the opportunity to stop in the shops or have a beer at a bar. 5, Day 3 Fancy lunch was lovely especially the chicken which we had not had much of, but we had similar food for breakfast and dinner. See my notes above re food variety.."], ["Elizabeth Armitage", "Kumano Kodo (Japan)", 5, "02 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Luggage & Transfers"], "A small suggestion - including info in the notes/app about where to find the bus stop at the end of the Kumano Kodo walk (to catch the bus into Kii Katsura) would be helpful as it is quite a way down the hill from end of walking track."], ["Janelle Buckley", "Kumano Kodo (Japan)", 5, "02 May", "Positive", ["No improvement needed"], "No"], ["Richard McMillan", "New Zealand", 5, "02 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "As always, recommend that travellers use a better mapping app and just rely on Raw travel app for the necessary informational documents."], ["Louise McMillan", "New Zealand", 5, "02 May", "Positive", ["No improvement needed"], "No"], ["Farbod Lashgari", "Kumano Kodo (Japan)", 4, "01 May", "Constructive", ["Accommodation", "Food & Meals"], "Ask the last two hotels to be more flexible for the time of dinner and breakfast"], ["Robyn Eastgate", "Kumano Kodo (Japan)", 5, "01 May", "Constructive", ["Accommodation", "Food & Meals", "Value & Pricing", "Weather, Safety & Conditions"], "I understand the converted school is adequate and I appreciated the community catering to the pilgrims. But a note on improving the bedding. The Kii peninsula is a wet place between 4 and 10 metres of rain per year. As such humidity is expected. Extra bedding is stored in large cupboards in each converted classroom. The bedding feels damp. Is there something that could be bought to absorb cupboard moisture?"], ["Lisa Campbell", "Kumano Kodo (Japan)", 5, "30 Apr", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation", "Guides & Group", "Luggage & Transfers"], "The pre trip info could have been more accurate. We discovered on our own one of the hotels had a courtesy bus .. we walked 27km that day at speed to get the local bus at a set time which was totally unnecessary"], ["Tiff Comb", "New Zealand", 5, "30 Apr", "Constructive", ["Other / General"], "No I would highly recommend these hikes to anyone"], ["Jenny Sinclair", "Kumano Kodo (Japan)", 5, "30 Apr", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy"], "I've just looked at the app, and all the content has been wiped, which is really disappointing both from a point of view of being able to write up my travel journal notes, and being able to offer feedback. I had a couple of inaccuracies noted that could have been useful to future walkers, but without the app, can't really specify them."], ["Hendrik De Korte", "Kumano Kodo (Japan)", 5, "30 Apr", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "app needs improvement and distances were often not correct"], ["Deborah McNay", "Kumano Kodo (Japan)", 5, "30 Apr", "Positive", ["Food & Meals"], "It was very good. I loved the accom and meals"], ["Ann Bray", "Nakasendo Way (Japan)", 4, "30 Apr", "Positive", ["Accommodation", "Food & Meals"], "Japan is a wonderful destination. Less Ryokan food."], ["Belinda Gold", "Nakasendo Way (Japan)", 4, "29 Apr", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Local Support & Communication"], "I think a bit of a check in would have been good. felt like we got the pre trip email and then never heard a word. There was an option for emergency issues but otherwise it was kind of fend for yourself. Some of the information on the app needs updating and overall there could be more information about things to see in the area. For example I found out through a Facebook page about nearby waterfalls."], ["Cyrille Deveau", "Camino (Spain)", 5, "29 Apr", "Positive", ["Other / General"], "I don\u2019t believe so, everything was perfect."], ["Liz Thomas", "Camino (Spain)", 5, "29 Apr", "Negative", ["Itinerary & Route Info Accuracy", "Accommodation", "Luggage & Transfers"], "Please ensure hotels names are up to date and reflect any recent changes. Also please ensure detailed information is included in the itinerary regarding any transfers eg we were confused about the transfer when we first started at Leon."], ["Mark Benham", "Kumano Kodo (Japan)", 4, "29 Apr", "Constructive", ["App & Navigation", "Guides & Group", "Pre-Trip Planning"], "The app did not work offline. We used AllTrails for navigation. Also there is a fabulous guide book on the Kumano Kodo trail which has downloadable row maps - at approx $20, I think you should consider providing a copy to anyone booking the walk. ."], ["Mary Collis", "Michinoku Coastal Trail (Japan)", 5, "28 Apr", "Constructive", ["Accommodation", "Food & Meals"], "I loved the mom and pop lunch restaurants along the way- quick, simple, local foods. But the big set meals in hotels were a bit much. I enjoy the food but don\u2019t care for such luxury on a hike."], ["Mary Collis", "Kumano Kodo (Japan)", 5, "28 Apr", "Constructive", ["Accommodation", "Food & Meals"], "To be honest, the set meals in these luxury hotels got a bit much. As a hiker, I\u2019m interested in fuelling myself adequately for the next day- not in having luxury meals that go on too long and are too much food. I would have given anything to have a buffet where I could just get what I wanted quickly. Or go to a Kombini instead. I simply love the Japanese food- but sitting for 1 - 1 1/2 hrs literally is too long when you want to prepare for the next day and not feel stuffed!  I think maybe the hotels were suited for luxury travellers- not for serious hikers, thus this food issue. You haven\u2019t decide if you are a luxury traveller company or a hiking Company. I\u2019d be happy with less luxury and simpler meals with maybe one special meal on a hike."], ["Mary Collis", "Kumano Kodo (Japan)", 5, "28 Apr", "Constructive", ["Accommodation", "Food & Meals"], "To be honest, the set meals in these luxury hotels got a bit much. As a hiker, I\u2019m interested in fuelling myself adequately for the next day- not in having luxury meals that go on too long and are too much food. I would have given anything to have a buffet where I could just get what I wanted quickly. Or go to a Kombini instead. I simply love the Japanese food- but sitting for 1 - 1 1/2 hrs literally is too"], ["Jenny Power", "Nakasendo Way (Japan)", 5, "27 Apr", "Positive", ["No improvement needed"], "No it was a great experience."], ["Peter Cox", "Kumano Kodo (Japan)", 4, "27 Apr", "Negative", ["Other / General"], "I was not happy with the with the pre trip advice re accomodation"], ["Stephen Dowse", "Via Francigena (Italy)", 5, "27 Apr", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "GUIBO app underestimated the daily distance walked"], ["Siun Gallagher", "Via Francigena (Italy)", 5, "26 Apr", "Constructive", ["Other / General"], "One or two of the walks were too short or too unchallenging."], ["Jennifer McEwan", "Nakasendo Way (Japan)", 5, "25 Apr", "Constructive", ["Other / General"], "I was very happy with how the trip was organised and executed."], ["Fiona Harris", "Kumano Kodo (Japan)", 5, "23 Apr", "Constructive", ["Guides & Group", "Luggage & Transfers", "Pre-Trip Planning", "Weather, Safety & Conditions"], "The local guide we met with the night before we started strongly advised us against doing the full 25km day, wanted us to get the bus and do 27km. 5 of us did the full 25km in the rain, it was a 9 hour day but achievable"], ["Carolyn Layton", "Kumano Kodo (Japan)", 5, "23 Apr", "Positive", ["Itinerary & Route Info Accuracy", "Accommodation", "Guides & Group", "Pre-Trip Planning"], "No as independent travellers this is the first time we have engaged a travel company to organise a hike. Being self-guided was perfect for us. It was great having all the accommodation booked and transport to and from hike sorted for us. We met independentvtravellers who told us we made the right decision and detailed the difficulties they had with bookings etc as first timers to Japan."], ["Cordelia Williams", "Kumano Kodo (Japan)", 4, "23 Apr", "Negative", ["Itinerary & Route Info Accuracy", "Local Support & Communication"], "Mike, the local representative consistently gave poor, misleading or inaccurate information. The answer to every question was no, that\u2019s not possible. Frequently, all that was required was a little effort or creativity."], ["Kurt Engel", "New Zealand", 5, "22 Apr", "Positive", ["No improvement needed"], "Not really , whole experience has been very good"], ["Anita Rogers", "Kumano Kodo (Japan)", 4, "22 Apr", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Luggage & Transfers"], "Day by day map with elevations and more details about catching the bus(s)"], ["Anita Rogers", "Kumano Kodo (Japan)", 4, "22 Apr", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Luggage & Transfers"], "Day by day map with elevations and more details about catching the bus(s)"], ["Peter Cox", "Kumano Kodo (Japan)", 4, "22 Apr", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "Update the app to include an accurate route - often the physical signs were different to the app, travel distances and information on important route options where there is not just a single track."], ["Poppy Walker", "Kumano Kodo (Japan)", 5, "21 Apr", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Luggage & Transfers"], "The links to the accom on your app don't work - they just link to google pages lisiitng several places. That was frustrating and we had to enter accom in mnaully on our google apps instead. There was also a lack of info about how to find the bus stop on our second last day which could easily be rectified with a map. More cultural history would also be excellent. the audio option wasn't practical for some who wanted to read more about the history. You could also incliude some basic language for ytravellers who would like to learn the basics?"], ["Helen Moye", "New Zealand", 5, "21 Apr", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The app for Queen Charlotte highlighted each night\u2019s destination. So I could se my location, but it did. To show the actual track route itself so I did not know if I was on the track per the app at all. Track was otherwise very clear, but the app served no purpose."], ["Jenny Webber", "Kumano Kodo (Japan)", 5, "21 Apr", "Constructive", ["Food & Meals"], "We found lunch on the first to days to be too large both fitting into our backpacks and the amount of food. Both were beautifully presented but we didn\u2019t need the amount we were given and had to be thrown away"], ["Shereen Deppe", "Nakasendo Way (Japan)", 5, "21 Apr", "Negative", ["App & Navigation", "Accommodation", "Luggage & Transfers", "Weather, Safety & Conditions"], "1) Marking out Parking lot on the app for Day 4 (2) Morino hotel change (3) Timing on Day 5 either to leave hotel earlier as we could only depart late no earlier options to catch the train or alternative options if you miss the train (we did make it actually with 1 hour to spare, but we rushed the whole walk and took the option to miss the first 3km)"], ["Nicole Osborne", "Kumano Kodo (Japan)", 4, "20 Apr", "Negative", ["Itinerary & Route Info Accuracy", "Local Support & Communication"], "There was a lot of information to sift through. Emails, long doc etc. These could definitely be streamlined. The details of our accomodation for the second night were inaccurate. I\u2019ll send you details."], ["Jacqueline Moir", "Nakasendo Way (Japan)", 5, "20 Apr", "Positive", ["No improvement needed"], "No"], ["Ian Montague", "Nakasendo Way (Japan)", 5, "19 Apr", "Constructive", ["Other / General"], "Not at all"], ["Jacqui Altman", "Kumano Kodo (Japan)", 5, "18 Apr", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation", "Luggage & Transfers", "Weather, Safety & Conditions"], "A few more detailed tips and tricks would have assisted greatly especially with finding accommodation after getting off a bus in the dark in torrential rain, we were quite confused in Watarase Onsen and finding Happiness accommodation. Also, advice about what to do when you can't make the last bus or the times for check-in. Hiking the terrain in wet and slippery conditions is slow going and we were very stressed about the time restrictions."], ["Wendy Maxwell", "Kumano Kodo (Japan)", 4, "18 Apr", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation", "Guides & Group"], "Providing information on \"getting to your accommodation\".  We relied upon locals to guide us to the accommodation in Chikatsura."], ["Frank Wittwer", "Michinoku Coastal Trail (Japan)", 5, "16 Apr", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation"], "I have a Galaxy S23 phone. I could not get the RAW Travel App to stay open when on airplane mode. I tried different modes of leaving it open then going on airplane mode but it would close down. I tried downloading it again according to instructions but no change.  In phone reception areas it was more stable but would often shut down but could be opened up again due to having reception. Monika had an Apple phone which was more stable but still had some problems.  The App \"All Trails\" had no problems tracking the walks and never shutdown and gave all the details of distance, elevation etc.  The section from Fudai to Kurosaki did not have a path on the App. The Michinoku is well marked and we only needed the  App to occasionally and there was phone reception so it worked."], ["Ashley Jackson", "Kumano Kodo (Japan)", 5, "15 Apr", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation"], "Yes, on two locations when describing how to get to accommodation, the information was not sufficient to explain how to get there."], ["Simon Miller", "Kumano Kodo (Japan)", 5, "15 Apr", "Constructive", ["Guides & Group", "Value & Pricing"], "Probably didn't need the extra day in Hongu, could've reduced the length by a day. Possibly could structure a self-guided tour that starts hike in the early afternoon on Day 1 from Takijiri to Takahara, making Day 2 Takahara to Tsugizakura, Day 3 a bit shorter to get to Hongu early afternoon, skip rest day ... just a thought, maybe an option worth offering."], ["Simone Clancy", "Nakasendo Way (Japan)", 5, "14 Apr", "Positive", ["Other / General"], "Cannot fault the service from RAW travel! Another great experience"], ["Louise Hanlon", "New Zealand", 5, "13 Apr", "Positive", ["Food & Meals", "Luggage & Transfers"], "Everything was very well organised. The private transport between Picton and Nelson was excellent and our driver was so helpful and friendly. It was a lovely day with lunch at the Slip Inn!"], ["Jo-Anna Wong", "Kumano Kodo (Japan)", 5, "13 Apr", "Constructive", ["Food & Meals"], "only one small hiccup. Lunch collection in Kii-Tanabe was not at the place that was specified in trip documentation"], ["Megan Criddle", "Nakasendo improvement needed"], "No"], ["Jaclyn Frantz", "Nakasendo Way (Japan)", 5, "04 Apr", "Negative", ["Food & Meals", "Local Support & Communication", "Pre-Trip Planning"], "Hikes on Day 2, and especially on Day 5, should be shortened. Too long and difficult for what is promoted as an easy walking vacation. On Day 5, lunches should be pre-packed and provided by RAW, rather than taking us to a grocery store where we don't know what is perishable, etc.  Destination Specialist needs to be more thorough in pre-trip responses to email. Participants over 70 should be more thoroughly vetted for fitness level before the trip."], ["Nelly Joseph", "Camino (Spain)", 5, "03 Apr", "Positive", ["No improvement needed"], "No throughly enjoyed the whole trip."], ["Melinda McLean", "Kumano Kodo (Japan)", 5, "03 Apr", "Constructive", ["Guides & Group"], "Maybe offer a one-hour teleconference with self guided hiking group to answer any questions.  We found Chris very responsive and helpful for our individual questions.answer any"], ["Helen Glendining", "Australia", 5, "02 Apr", "Positive", ["No improvement needed"], "Not really"], ["Susan Warrender", "Nakasendo Way (Japan)", 5, "01 Apr", "Positive", ["Other / General"], "The whole experience was really great"], ["Philip LANE", "Camino (Spain)", 5, "01 Apr", "Constructive", ["App & Navigation"], "perhaps a trip elevation profile might be useful to know when the ups and downs are coming!"], ["Frank Wittwer", "Kumano Kodo (Japan)", 5, "01 Apr", "Constructive", ["App & Navigation", "Weather, Safety & Conditions"], "The RAW Travel app would not open in air plane mode or out of phone reception  on Android phone GalaxyS23.  Tried leaving app open when in reception range and moving into non receptionist area it closed.  Tried opening it in reception area, changing to airplane mode but it closed .  Also missed the profile and indication on the profile of one's location.  However the app was hardly needed as the trail was well marked and in towns where it was needed there was reception."], ["Wendy Wittwer", "Kumano Kodo (Japan)", 4, "01 Apr", "Constructive", ["App & Navigation", "Guides & Group", "Pre-Trip Planning"], "We feel that we would have liked to be provided with a day by day profile before we booked, and also have it included on the app. Two of our group chose not to walk the last day because we did not feel confident that we could make it."], ["Andrew Gale", "Kumano Kodo (Japan)", 5, "31 Mar", "Positive", ["No improvement needed"], "No"], ["Merilyn Eleanor Souter", "Australia", 5, "30 Mar", "Positive", ["No improvement needed"], "Nothing at all"], ["Zeglar Fergus", "Australia", 5, "30 Mar", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation", "Food & Meals", "Luggage & Transfers"], "Not really, but I will give a shout out to Jenny our driver who provided plenty of detail information, Angie from the retreat who made our stay very enjoyable, and Jodie for her great cooking and meal preparation."], ["Catherine Tozer", "Kumano Kodo (Japan)", 5, "28 Mar", "Constructive", ["Guides & Group"], "The hiking guide book was really good"], ["Ian Gordon", "New Zealand", 5, "27 Mar", "Positive", ["No improvement needed"], "No"], ["Julie Blackshaw", "New Zealand", 4, "27 Mar", "Constructive", ["Accommodation", "Value & Pricing"], "One of our accomodations was changed and Raw travel didn\u2019t let us know. The Tara Cove was fantastic however was nearly $150 cheaper than Furneaux Lodge where we thought we were staying."], ["Anna Robert", "Nakasendo Way (Japan)", 5, "27 Mar", "Positive", ["No improvement needed"], "No"], ["Ray Flanagan", "New Zealand", 5, "26 Mar", "Constructive", ["Other / General"], "See above"], ["David Barnes", "Australia", 5, "26 Mar", "Positive", ["No improvement needed"], "No."], ["Julie Slaghekke", "Kumano Kodo (Japan)", 5, "24 Mar", "Positive", ["No improvement needed"], "No"], ["Tracey Evans", "New Zealand", 5, "23 Mar", "Positive", ["No improvement needed"], "No - we enjoyed all aspects of the trip"], ["Judy Postan", "New Zealand", 5, "23 Mar", "Positive", ["No improvement needed"], "No"], ["Cynthia Moncrieff", "Australia", 5, "22 Mar", "Constructive", ["App & Navigation", "Food & Meals", "Luggage & Transfers"], "Food was great and a $55 limit allowed us to share when a main is way to large for most people so allowing us to have an entree and share a main was sensible. Apaper map  provided beforehand so family could see where we were heading would be useful and a good memento. An Apistke hat pin and bucket hat provided would also be good additions - many overseas walking companies provide this and they are great conversation starters and advertisers for your company. Refillable water bottles used during transfers or the walk are also good in this way."], ["Cynthia Moncrieff", "Australia", 5, "22 Mar", "Constructive", ["Luggage & Transfers"], "A carabiner to attach the rubbish bag, a visor or bucket hat (lots of international walking companies provide these for their clients) and a (apostle) for your hat as a lasting memento!"], ["Josephine Tramonte", "Kumano Kodo (Japan)", 5, "21 Mar", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The distances in the app were often less than the actual distances walkf"], ["Fiona Johnson", "New Zealand", 5, "19 Mar", "Constructive", ["App & Navigation", "Local Support & Communication", "Luggage & Transfers"], "The app was good but would be helpful to have the altitude profile linked to the map so you knew if there was a climb ahead or easy going etc as the signs/paper maps were all different ! This was important to us because we had specific times to meet boat taxis"], ["Jennifer Glasson", "Australia", 5, "17 Mar", "Constructive", ["Itinerary & Route Info Accuracy", "Weather, Safety & Conditions"], "I would like to have had a more descriptive view of where we were to walk.We had really no idea about the terrain.The paths turned out to be excellent."], ["Debra Patrick", "New Zealand", 5, "16 Mar", "Positive", ["No improvement needed"], "No"], ["Debbie Irving", "Australia", 5, "16 Mar", "Positive", ["No improvement needed"], "No"], ["Diane Martin", "Australia", 5, "16 Mar", "Positive", ["No improvement needed"], "No"], ["Eleanor Parker", "Nakasendo Way (Japan)", 5, "13 Mar", "Constructive", ["Other / General"], "the time allocated to walking each day to reach the destination was too short. We would have liked more time to explore the post towns and stop for snacks and to enjoy the surrounds."], ["Ross Glasson", "Australia", 5, "09 Mar", "Negative", ["Other / General"], "Day 5 is a bit boring compared to days 1-3."], ["Anne Sykes", "New Zealand", 5, "05 Mar", "Positive", ["No improvement needed"], "No!"], ["Warren Fuller", "New Zealand", 5, "25 Feb", "Positive", ["No improvement needed"], "No"], ["Carl Brown", "Kumano Kodo (Japan)", 4, "22 Feb", "Constructive", ["Other / General"], "Not sure."], ["Natalie Meaney", "New Zealand", 5, "12 Feb", "Positive", ["Other / General"], "Overall excellent"], ["Anja Mueller", "Australia", 5, "01 Feb", "Positive", ["No improvement needed"], "No"], ["Rebecca Lim", "Kumano Kodo (Japan)", 5, "13 Jan", "Positive", ["No improvement needed"], "No"], ["Jenny  Campbell", "Kumano Kodo (Japan)", 5, "07 Jan", "Constructive", ["Luggage & Transfers"], "not really. By combining the first and second days walks in one day though and getting on the first bus to do so, the 1st day was ridiculously crowded which was a little unfurtunate. After that, all was great :)"], ["Graeme Breen", "Australia", 5, "02 Jan", "Positive", ["No improvement needed"], "NIL"]]};
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'],C={g:'#2a9d6f',r:'#d64545',b:'#2f6fb5',a:'#e0a526',gr:'#8a96a3'};
const tabs=[['all','Overview'],['sat','Satisfied (4–5)'],['uns','Not Satisfied (1–3)'],['cm','Comment Insights'],['af','Affected Clients']];
let ch=[];const $=s=>document.querySelector(s);
if(window.Chart){Chart.defaults.color=getComputedStyle(document.body).color;Chart.defaults.maintainAspectRatio=false;Chart.defaults.font.size=11}
const kp=(v,l,c)=>`<div class="k" style="border-top-color:${c||C.b}"><b>${v}</b><span>${l}</span></div>`;
const card=(t,id)=>`<div class="c"><h3>${t}</h3><div class="h"><canvas id="${id}"></canvas></div></div>`;
const mk=(id,cfg)=>ch.push(new Chart(document.getElementById(id),cfg));
const topN=(g,k)=>Object.entries(D[g].themes).sort((a,b)=>b[1]-a[1]).slice(0,k);
const pct=(a,b)=>(a/b*100).toFixed(1)+'%';
function show(k){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));ch.forEach(c=>c.destroy());ch=[];
 const m=$('#m');k=='cm'?cm(m):k=='af'?af(m):grp(m,k)}
function grp(m,k){const d=D[k],col=k=='uns'?C.r:k=='sat'?C.g:C.b,tt=topN(k,3);
 let h='<div class="kpis">'+kp(d.n,'Responses',col)+kp(d.avg,'Avg overall rating (1–5)',col)+kp(k=='all'?D.all.satpct+'%':k=='sat'?pct(d.n,608):pct(d.n,608),k=='all'?'Satisfied clients':'Share of all responses',col)+kp(d.again+'%','Would travel again',col)+kp(d.comments,'Improvement comments',col)+'</div>';
 const msg={all:`Overall satisfaction is high, but the 5.8% not-satisfied group is where most issues are concentrated. App usefulness: ${D.appLow.uns}% of not-satisfied clients rated the app "seldom/not useful" vs ${D.appLow.sat}% of satisfied clients.`,
 sat:`Satisfied clients rate the trip highly, yet their comments still point to fixable friction. Top themes: ${tt.map(x=>x[0]+' ('+x[1]+')').join(', ')}.`,
 uns:`Small group, high impact: they are far less likely to rebook (${d.again}%). Top themes: ${tt.map(x=>x[0]+' ('+x[1]+')').join(', ')}.`}[k];
 h+=`<div class="ins">${msg}</div><div class="grid">`+card('Overall rating distribution','a')+card((k=='all'?'Responses & % satisfied by month':'Responses by month'),'b')+card('Avg rating by destination (n ≥ 8)','c')+card('Service sub-scores (avg; app 1–4, others 1–5)','d')+card('What clients mention (comment themes)','e')+card('Comment sentiment','f')+'</div>';
 m.innerHTML=h;const lab=['5 Very satisfied','4 Satisfied','3 Neutral','2 Dissatisfied','1 Very dissatisfied'];
 mk('a',{type:'bar',data:{labels:lab,datasets:[{data:d.dist,backgroundColor:[C.g,'#7bc8a4',C.a,'#e8885a',C.r]}]},options:{plugins:{legend:{display:false}}}});
 const ds=[{type:'bar',label:'Responses',data:d.monthly,backgroundColor:col,yAxisID:'y'}];
 if(k=='all')ds.push({type:'line',label:'% satisfied',data:D.monthsat,borderColor:C.a,backgroundColor:C.a,yAxisID:'y1',tension:.3});
 mk('b',{data:{labels:M,datasets:ds},options:{scales:{y:{beginAtZero:true},y1:{display:k=='all',position:'right',min:60,max:100,grid:{drawOnChartArea:false}}}}});
 mk('c',{type:'bar',data:{labels:d.dest.names,datasets:[{data:d.dest.avg,backgroundColor:col}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{min:k=='uns'?1:3,max:5}}}});
 mk('d',{type:'bar',data:{labels:['Accommodation','Pre-trip service','RAW App','Local support'],datasets:[{data:d.subs,backgroundColor:[C.b,C.b,C.a,C.b]}]},options:{plugins:{legend:{display:false}},scales:{y:{min:0,max:5}}}});
 const t=Object.entries(d.themes).sort((a,b)=>b[1]-a[1]);
 mk('e',{type:'bar',data:{labels:t.map(x=>x[0]),datasets:[{data:t.map(x=>x[1]),backgroundColor:col}]},options:{indexAxis:'y',plugins:{legend:{display:false}}}});
 const s=['Positive','Constructive','Negative'];
 mk('f',{type:'doughnut',data:{labels:s,datasets:[{data:s.map(x=>d.sent[x]||0),backgroundColor:[C.g,C.a,C.r]}]},options:{plugins:{legend:{position:'right'}}}})}
function qs(g){return D[g].quotes.map(q=>`<div class="q"><small><span class="tag" style="background:${{Positive:C.g,Constructive:C.a,Negative:C.r}[q.s]}">${q.s}</span>${q.d} · rated ${q.o}</small>${q.t}</div>`).join('')}
function cm(m){const a=D.all,cols=[C.g,C.a,C.r],s=['Positive','Constructive','Negative'];
 const t=Object.keys(a.ths).sort((x,y)=>a.themes[y]-a.themes[x]);
 m.innerHTML=`<div class="kpis">${kp(a.comments,'Comments received')}${kp(a.subst,'With a real improvement point')}${kp(a.sent.Constructive,'Constructive suggestions',C.a)}${kp(a.sent.Negative,'Negative / complaints',C.r)}${kp(a.sent.Positive,'Positive / nothing to improve',C.g)}</div>
 <div class="ins"><b>Patterns</b><ul><li><b>The app and trip information dominate</b> – the two biggest themes for both satisfied and not-satisfied clients: out-of-date or inaccurate routes, hotel names, missing elevation/daily distance, and basic navigation versus Komoot/AllTrails.</li>
 <li><b>Accommodation consistency</b> – inconsistent standards, remote locations without dinner options, and listings that differ from brochures.</li>
 <li><b>Dissatisfied clients</b> also cite weak local support on arrival (Japan, Norway), itinerary changes communicated late, and value-for-money doubts.</li>
 <li><b>Satisfied clients</b> mostly say "nothing" or praise guides, yet 1 in 4 still request app and itinerary fixes – a cheap win for retention.</li></ul>
 <small>Sentiment and themes are keyword-rule based; treat as directional.</small></div>
 <div class="grid">${card('Sentiment: satisfied vs not satisfied','a')+card('Themes by sentiment (all comments)','b')+card('Theme share: satisfied vs not satisfied (% of comments)','c')}
 <div class="c"><h3>Satisfied clients – sample comments</h3>${qs('sat')}</div><div class="c"><h3>Not satisfied clients – sample comments</h3>${qs('uns')}</div></div>`;
 mk('a',{type:'bar',data:{labels:['Satisfied (4–5)','Not satisfied (1–3)'],datasets:s.map((x,i)=>({label:x,backgroundColor:cols[i],data:['sat','uns'].map(g=>(D[g].sent[x]||0)/D[g].comments*100)}))},options:{indexAxis:'y',scales:{x:{stacked:true,max:100,ticks:{callback:v=>v+'%'}},y:{stacked:true}}}});
 mk('b',{type:'bar',data:{labels:t,datasets:s.map((x,i)=>({label:x,backgroundColor:cols[i],data:t.map(k=>a.ths[k][x])}))},options:{indexAxis:'y',scales:{x:{stacked:true},y:{stacked:true}}}});
 mk('c',{type:'bar',data:{labels:t,datasets:[{label:'Satisfied',backgroundColor:C.g,data:t.map(k=>D.sat.themes[k]/D.sat.comments*100)},{label:'Not satisfied',backgroundColor:C.r,data:t.map(k=>D.uns.themes[k]/D.uns.comments*100)}]},options:{indexAxis:'y',scales:{x:{ticks:{callback:v=>v+'%'}}}}})}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F={t:'All',g:'all',s:'all',q:''};
function af(m){const ths=['All',...Object.keys(D.all.themes),'Other / General','No improvement needed'];
 m.innerHTML=`<div class="ins">All clients who answered the improvement question (blank answers excluded); "No improvement needed" covers replies like "No" or "Nothing". Filter by issue, group or sentiment; not-satisfied clients are listed first.</div>
 <div class="chips" id="chips"></div><div class="f"><select id="fg"><option value="all">All clients</option><option value="sat">Satisfied (4–5)</option><option value="uns">Not satisfied (1–3)</option></select>
 <select id="fs"><option value="all">All sentiment</option><option>Negative</option><option>Constructive</option><option>Positive</option></select><input id="fq" placeholder="Search name, destination or feedback" size="34"><b id="cnt" style="align-self:center"></b></div>
 <div class="tw"><table><thead><tr><th>Client</th><th>Destination</th><th>Rating</th><th>Date</th><th>Sentiment</th><th>Issue(s)</th><th>Feedback</th></tr></thead><tbody id="tb"></tbody></table></div>`;
 const chips=()=>{$('#chips').innerHTML=ths.map(t=>`<button class="${F.t==t?'on':''}" data-t="${esc(t)}">${esc(t)} (${D.rows.filter(r=>t=='All'||r[5].includes(t)).length})</button>`).join('');
  document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{F.t=b.dataset.t;draw()})};
 const draw=()=>{chips();const q=F.q.toLowerCase(),sc={Positive:C.g,Constructive:C.a,Negative:C.r};
  const R=D.rows.filter(r=>(F.t=='All'||r[5].includes(F.t))&&(F.g=='all'||(F.g=='sat')==(r[2]>=4))&&(F.s=='all'||r[4]==F.s)&&(!q||(r[0]+r[1]+r[6]).toLowerCase().includes(q)));
  $('#cnt').textContent=R.length+' clients';
  $('#tb').innerHTML=R.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td style="color:${r[2]>=4?C.g:C.r};font-weight:700">${r[2]}</td><td>${r[3]}</td><td><span class="tag" style="background:${sc[r[4]]}">${r[4]}</span></td><td>${r[5].map(esc).join(', ')}</td><td class="fb">${esc(r[6])}</td></tr>`).join('')};
 $('#fg').onchange=e=>{F.g=e.target.value;draw()};$('#fs').onchange=e=>{F.s=e.target.value;draw()};$('#fq').oninput=e=>{F.q=e.target.value;draw()};draw()}
$('#nav').innerHTML=tabs.map(t=>`<button data-k="${t[0]}">${t[1]}</button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>run(b.dataset.k));
function run(k){try{if(!window.Chart)throw new Error('Chart library failed to load (check network/ad-blocker)');show(k)}catch(e){$('#m').innerHTML='<div class="ins">Could not draw charts: '+e.message+'</div>'}}run('all');
</script></body></html>
