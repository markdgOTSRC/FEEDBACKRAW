Jul", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Guides & Group", "Pre-Trip Planning"], "More accurate information before booking. I have been in a walking group for many years and have done many long walks previously. The information I needed was not available at booking time eg. I received the app 1 day before leaving to go to Italy."], ["Marion Bromley", "Norway (St Olav)", 3, "08 Jul", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "App should be more accurate and match pilgrim signage"], ["Jenni Wearing-Smith", "Camino (Spain)", 2, "30 Jun", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation"], "Some information on where I was walking, distances each day and a clear itinerar6 would have been helpful rather than just a list of accommodation.  Notes on walking routes and sights en route, or places of interest for days off.  Some information on public holidays in destinations on my travel dates would have been helpful."], ["John Tucker", "UK (South West Coast Path)", 3, "28 Jun", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Food & Meals", "Luggage & Transfers"], "The choice of accommodation needed improvement. The trail on the app was out of date. We used AllTrails instead. There was also a lack of information on points of interest in the RAW Travel app and no suggestions for restaurants except at Exmouth. Also we did not receive luggage tags."], ["Tracey  Newton", "UK (South West Coast Path)", 3, "23 Jun", "Constructive", ["Weather, Safety & Conditions"], "All of the above,  also to know the water tides, central accomodation."], ["KATE TURNER", "Norway (Lofoten)", 3, "21 Jun", "Constructive", ["Local Support & Communication", "Guides & Group"], "Most of the improvements have been emailed with suggestions, please refer.   I think a local guide and cook would have enabled us to feel more connected to the country and offered us the cultural experience that Raw Travel promotes will be part of the trip."], ["James O'Dea", "UK (Hadrians Wall)", 3, "04 Jun", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Local Support & Communication"], "The App. To be blunt, it is not good enough for what you are selling it as.   Pros:  1. It tracks you in real time.  2. It lists your hotels   Cons:  1. You cannot filter the trek via e.g.stays or attractions etc. It is all in together and you have to very closely zoom in on your phone.  2. With the items listed on the map, toilets are not one of them.\u00a0  3. There is a button called Your Routes, but it isn't my route. It is just some random selection of point to point routes which may or may not match your actual schedule and only shows some days and not others.\u00a0  4. Aside from the showing of the entire route in Your Routes, there is other elevation profile for day by day which would be very useful to plan the day.  5. The day by day section gives me great detail of where we are staying for the night. To me day by day should give me details of my actual day I.e.the walk and not the overnight stay.\u00a0  6. There is no listing of how far each day is. You either have to navigate the route and find the walking man symbol amongst all the other symbols or go back to the original synopsis and itinerary that we received in an email months ago when we booked.   To be honest, we were better off using All Trails (which like your app, tracks us in real time) or we found a free site that another walker has developed where you can build your own point to point routes. It shows Kms and elevations."], ["Kathy Chislett", "Kumano Kodo (Japan)", 2, "31 May", "Negative", ["App & Navigation"], "As mentioned above I was pretty disappointed. I am grateful for the company we were walking with. The app needs to be improved to function like Google or Komoot so that if you get lost you can find your way. It is very basic re mapping otherwise it was good."], ["Simone Keddy", "Kumano Kodo (Japan)", 3, "27 May", "Constructive", ["App & Navigation", "Accommodation", "Local Support & Communication", "Luggage & Transfers"], "The spring festival was postponed a day. We were told you could stay and watch and catch a bus then second bus or intervals. A request was made to do both as it was an easy day hike and the festival started at 1pm. No support was offered. Other companies arranged for their hikers to be stopped off at the end if the hike to hike back. We had to arrange by ourselves which bus to catch to the end if the hike yo hike in reverse and then see the spring festival. We had yo arrange ourselves with the help of the wonderful Win at the hotel. Then after I checked Google maps I found rectal recommended we change buses to them be picked up by Takata Greenland. YET by staying in the same bus we pass much closer to Takata Greenland than changing buses. Win arranged to Takata to pick us up from the nearby stop saving us anc the hotel time. THIS should have been done by raw travel. Very very disappointed in this. It\u2019s supposed to be your forte arranging the trip and yet I had to do it all myself."], ["nicholettestewart", "Kumano Kodo (Japan)", 2, "26 May", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation", "Local Support & Communication", "Guides & Group", "Value & Pricing"], "Better support at destination. I would have expected a formal debriefing in person from a local RAW representative instead of a handover from the tourist information employee. The level of accommodation was inconsistent and I do not feel that I have received value for money on this hike. Unlikely to use RAW again and will not be recommending to friends and family. This is not the first hike or self guided trip (domestic and international ) I have done so I do not have unrealistic expectations."], ["Elizabeth Hanley", "Camino (Spain)", 3, "26 May", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "Combine itinerary information from Raw website with more information about route travel in app. Be realistic about amount of.road walking eg into Lazema"], ["Melina Puglisi", "Camino (France)", 2, "25 May", "Constructive", ["Itinerary & Route Info Accuracy", "Local Support & Communication"], "Have more communications and give a more information about levels of walks."], ["Laura Neebling", "Camino (France)", 3, "20 May", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Local Support & Communication", "Luggage & Transfers", "Pre-Trip Planning"], "The pdf itinerary that was sent to us in advance of our trip was not accurate. We raised this and the problem was fixed, but trust was broken from that point on. That was compounded by an itinerary change that meant that we had to walk nearly 22 miles on our second day, that day being the part of the hike with the most elevation gain of the whole trip. I think I could have handled this better if the final itinerary had been worded differently, it said something like we\u2019ve had to make a minor change in your itinerary, if you want you can take a bus, but bus tickets have to be purchased in advance and it only makes two stops along the relevant stretch of roadway. Someone should have written a separate email to us, or called, to talk us through the options for that day. That would have meant so much to me. Instead Liz came off as inaccessible, even now after completing that beautiful walk, the issues around the change of itinerary and that 21 mile day on day 2 still bother me."], ["Bi Yong Chungunco", "Slovenia", 3, "16 May", "Constructive", ["Itinerary & Route Info Accuracy", "Food & Meals", "Weather, Safety & Conditions"], "The itinerary can be improved.   The wineries are closed or needed to be pre-booked.   Your itinerary said we can just drop by the wineries.  Almost all are closed.  We had to go to the next town (30 minute drive) to book wine tasting."], ["Cathy Barnes", "Via Francigena (Italy)", 3, "07 May", "Constructive", ["Accommodation", "Value & Pricing"], "We paid extra to upgrade our rooms/property and we are unconvinced that this was a benefit"], ["Ron Coldebella", "Michinoku Coastal Trail (Japan)", 3, "04 May", "Negative", ["Weather, Safety & Conditions"], "Greater awareness of the potential impact of earthquakes - we would not have signed up if we were aware of the risk of course closure.  Also, the lack of walkers on the trail meant that the threat of bears made my wife uncomfortable taking away from the enjoyment of the environment,"], ["Greg Vigors", "Nakasendo Way (Japan)", 3, "30 Apr", "Constructive", ["App & Navigation"], "Some photos in the app did not match up with what I was seeing on the walk"], ["Johann Philip Nogueira", "Kumano Kodo (Japan)", 3, "28 Apr", "Negative", ["App & Navigation", "Local Support & Communication", "Value & Pricing"], "Yes, we were never contacted once we landed in Japan like we were when we did the Camino De Santiago. The maps on some parts had the lines not drawn properly so there was confusion about which roads to take and this cost us time as sometimes we would find ourselves on a different track."], ["Johann Philip Nogueira", "Kumano Kodo (Japan)", 3, "28 Apr", "Negative", ["App & Navigation", "Local Support & Communication", "Value & Pricing"], "Yes, we were never contacted once we landed in Japan like we were when we did the Camino De Santiago. The maps on some parts had the lines not drawn properly so there was confusion about which roads to take and this cost us time as sometimes we would find ourselves on a different track."], ["Dov Shiffman", "Kumano Kodo (Japan)", 3, "26 Apr", "Negative", ["App & Navigation", "Luggage & Transfers"], "The app is lacking in basic navigation feature (elevation change, miles left, direction, separate days, separate hike vs. bus). Most are available in exisiting navigation apps (komoot, all trails). Consider providing GPX files instead."], ["Helen Watts", "Kumano Kodo (Japan)", 2, "12 Apr", "Negative", ["App & Navigation", "Local Support & Communication", "Value & Pricing"], "There should be some sort of back up support. Spoke with other walkers from different companies. Much much cheaper. Im an experienced walker of Caminos with out companies and I found using your app and the map was a nightmare."], ["Maria Rocca", "Camino (Portugal)", 3, "06 Jan", "Constructive", ["Local Support & Communication"], "Better local support."], ["Elizabeth Fleetwood", "Camino (Spain)", 5, "09 Oct", "Positive", ["Other / General"], "I don\u2019t think so, it was amazing thank you. I\u2019m pondering the next trip!!"], ["Leonie Berger", "Australia", 5, "08 Oct", "Negative", ["Food & Meals"], "Catering. Lentils for 2 evening meals, especially when you don't regularly eat lentils plays havoc on the gut. Maybe more carb eg pasta, rice, soyrdough bread and eggs for a simple breakfast. Don't get me wrong, the food was great, but didn't work well for seasoned and probably pretty basic trekkers. Cutlery(recycle forks)to eat meals on the trail would have been helpful."], ["Martin Gallagher", "Nakasendo Way (Japan)", 4, "07 Oct", "Negative", ["App & Navigation"], "The app seemed fragile, often reverted to a white blank screen. Manageable but better if more robust."], ["Jo Carden", "UK (South West Coast Path)", 5, "07 Oct", "Constructive", ["Itinerary & Route Info Accuracy"], "A lot more information about the sites, history, mythology and stories. We did a lot of our own research."], ["Karolina Kurylewski", "Camino (Spain)", 4, "07 Oct", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Local Support & Communication", "Luggage & Transfers", "Pre-Trip Planning"], "The itinerary we received before we left stated that we would be staying overnight in O Cebreiro, but this wasn't the case.  When we received your App just prior to leaving we didn't realise that our accommodation was instead booked in Fonfria.  We weren't informed about this via email at any stage before we left.  This was a bit disappointing."], ["Cathie Cohn", "UK (Cornish Camino)", 5, "07 Oct", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The notes for day 4 for walk from Fowey to Lanivet weren't very accurate - seemed to have been lifted from another section of the walk! Otherwise the App was excellent."], ["Cathie Cohn", "UK (Cornish Camino)", 5, "07 Oct", "Constructive", ["Itinerary & Route Info Accuracy"], "The notes for day 4 for walk from Fowey to Lanivet weren't very accurate - seemed to have been lifted from another section of the walk!"], ["jandyhopkins", "Mont Blanc (France)", 5, "06 Oct", "Constructive", ["Local Support & Communication"], "refer email to Amanda"], ["Anne Diamond", "UK (South West Coast Path)", 5, "06 Oct", "Positive", ["Itinerary & Route Info Accuracy"], "Thank you Leanne and team. I was impressed by how detailed and thoughtful your approach to this trip was and I was reassured by the organisation that went into making the trip so interesting and uncompiicated."], ["Jody Payne", "Danube Cycle Path", 4, "06 Oct", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Local Support & Communication"], "I was really hoping for more information about the areas we were traveling through. The app was nothing more than directions to points. I spent many hours beforehand creating lists of things to do and see in the areas we passed through. It would not be hard to add that info to your app or emails."], ["Dinah Read", "Camino (Spain)", 5, "05 Oct", "Constructive", ["Accommodation", "Local Support & Communication", "Guides & Group"], "As being on a self-guided tour, I would have felt somewhat supported with a daily group check-in from the local Raw agent"], ["CRAIG BUSING", "Michinoku Coastal Trail (Japan)", 4, "05 Oct", "Constructive", ["Pre-Trip Planning", "Weather, Safety & Conditions"], "Provided a bear bell as part of the kit."], ["Jodie Stephenson", "Puglia (Italy)", 5, "05 Oct", "Positive", ["No improvement needed"], "no. We all enjoyed our time."], ["jrsharpoo", "Via Francigena (Italy)", 5, "05 Oct", "Positive", ["No improvement needed"], "No, all went well."], ["Adele Thomas", "UK (Cornish Camino)", 4, "04 Oct", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy"], "RAW travel app was inaccurate on the leg \u2018Fowey to Padstow\u2019 and referred to a different section (Mevagissey) of the SWCP."], ["Diana Leicht", "UK (Cotswolds)", 4, "03 Oct", "Constructive", ["App & Navigation"], "Very clear kms and elevation daily in a single document or view."], ["ltcregan", "Camino (France)", 5, "03 Oct", "Positive", ["No improvement needed"], "No"], ["Patrice Scales", "UK (Cornish Camino)", 5, "02 Oct", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "We would have liked trip notes on the app, to add to the experience. We would read the RAW 'itinerary' notes before setting off.  It helped to give context to the route map."], ["Gill Hunt", "UK (South West Coast Path)", 5, "02 Oct", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "It would have been great to have more infiormation in the app - more history of the local are - or links to find out more, more information on items of interest on the path and more detail about the cahllenges of each section. A total kms for each day that was easy to access perks have also been good"], ["hilsonhilson", "Camino (Spain)", 5, "02 Oct", "Constructive", ["Accommodation", "Value & Pricing"], "Having now seen the trail and accommodation and we understand how it works and the costs, I think the RAW Travel cost is quite expensive relative to what was arranged."], ["Dan Schechter", "Camino (Spain)", 4, "02 Oct", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Weather, Safety & Conditions"], "See note on safety.  There were times that the RAW app route differed from Camino signage.   I generally found the RAW option better, but it would be useful if the app could flag the different options better."], ["sandraw45", "Camino (France)", 5, "01 Oct", "Constructive", ["Accommodation", "Food & Meals", "Pre-Trip Planning"], "My only suggestion would be to perhaps provide the offer of paying for all relevant dinners at the accommodation at the time of booking, especially where there are no other options available."], ["Lisa Sorgini", "Via Francigena (Italy)", 4, "01 Oct", "Constructive", ["App & Navigation", "Accommodation"], "The app needs a lot of work (it did not take us to our hotels) and the hotels need to be reviewed"], ["Chris Behrens", "UK (Coast to Coast)", 5, "01 Oct", "Constructive", ["Itinerary & Route Info Accuracy", "Local Support & Communication", "Guides & Group", "Luggage & Transfers"], "Possibly some more local services information would have been helpful e.g laundry. Our single-day guide was not that engaged or communicative. Bag service was reliable if a bit delayed some days but this is getting picky!"], ["Janine Brown", "Slovenia", 5, "01 Oct", "Constructive", ["Luggage & Transfers"], "At the transfer points it would be best if the drivers confirmed their names & who they are collecting- only a couple of small hitches"], ["athynne", "Camino (Spain)", 5, "29 Sep", "Positive", ["No improvement needed"], "Nothing"], ["Julie Parry-Barwick", "Camino (Spain)", 5, "28 Sep", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The app was fairly basic and we used Google maps together with the directions on the track as much, if not more, than the app. It would have been good to have a bit more information about things of note/things to do in each of the stopping points. Daniel was very responsive when we had a question early in the trip but it would have been nice if he would have checked in on how we were going once or twice throughout the trip."], ["Julie Parry-Barwick", "Camino (Spain)", 5, "28 Sep", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The app was fairly basic and we used Google maps together with the directions on the track as much, if not more, than the app. It would have been good to have a bit more information about things of note/things to do in each of the stopping points."], ["Nigel Purchase", "Slovenia", 5, "28 Sep", "Constructive", ["Guides & Group"], "No....everything was very well done. Sara the guide was very very good. Please pass on our thanks."], ["David Bird", "Camino (Portugal)", 5, "27 Sep", "Positive", ["No improvement needed"], "No"], ["Paul Roughead", "Kumano Kodo (Japan)", 4, "27 Sep", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Food & Meals", "Luggage & Transfers"], "Update the App when things are changed. Bento box lunches not appropriate. Provide option to shorten walks at both ends of each stage where possible"], ["Karen Schipper", "Loire Valley (France)", 4, "27 Sep", "Negative", ["Accommodation", "Luggage & Transfers", "Pre-Trip Planning"], "One of the first hiccups we encountered was when at the bike shop to pick up our bikes the booking was made under the name of 'MARSDEN' which is the middle name of our friend Virginia Adams who made all the bookings.  We eventually sorted out the name issue.  Also the luggage tags that were supposed to be at our hotel WEREN'T!!  The bike shop eventually printed them out for us but there was certainly some confusion as to who was to provide them."], ["Gregory Paterson", "Camino (Spain)", 5, "26 Sep", "Positive", ["No improvement needed"], "No, all good"], ["Jill Fausold", "Via Francigena (Italy)", 5, "26 Sep", "Constructive", ["App & Navigation", "Luggage & Transfers"], "Trip day was over 2 segments and app stopped working when 1st stage was reached.   We were without app for 18ks"], ["Jill Fausold", "Via Francigena (Italy)", 5, "26 Sep", "Constructive", ["App & Navigation", "Luggage & Transfers"], "Trip day was over 2 segments and app stopped working when 1st stage was reached.   We were without app for 18ks"], ["David Heale", "Norway (St Olav)", 5, "25 Sep", "Constructive", ["Weather, Safety & Conditions"], "You might mention that from time to time local track closures and diversions occur."], ["Peter Karp", "Camino (Spain)", 5, "25 Sep", "Negative", ["App & Navigation"], "Although the app was indispensible and greatly reduced the stress of navigating, it has a number of rough edges."], ["Janice McGrath", "Camino (Spain)", 4, "24 Sep", "Constructive", ["Other / General"], "Just the accomodation last minute change."], ["JANE BOURKE", "Camino (Spain)", 5, "24 Sep", "Positive", ["No improvement needed"], "no"], ["Sue Cramer", "Camino (Spain)", 5, "24 Sep", "Positive", ["No improvement needed"], "No"], ["Leonie Roberts", "Dolomites (Italy)", 5, "22 Sep", "Positive", ["Other / General"], "No I am very privileged to have been able to have had such an amazing experience."], ["Mary Collis", "Slovenia", 4, "22 Sep", "Negative", ["Guides & Group"], "Two guides for long days and steep sections- so faster people go with one guide, slower with a guide at the back. This is a big thing- on our walk many people were fuming at the speed we were forced to go for one person.Our guide did her best under difficult circumstances."], ["Gaye Jenkins", "UK (Hadrians Wall)", 5, "22 Sep", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "Personally, I am not a person who is good with technology, and although the app was easy to use and manage, I missed having paper track notes and maps - old fashioned, I know"], ["Susan Cory", "Slovenia", 5, "22 Sep", "Constructive", ["Itinerary & Route Info Accuracy"], "More detailed notes on trail itself  ie tree roots,big stones, steps."], ["Susan Cory", "Slovenia", 5, "22 Sep", "Constructive", ["Itinerary & Route Info Accuracy"], "More detailed notes on trail itself  ie tree roots,big stones, steps."], ["Bernie O'Brien", "Kumano Kodo (Japan)", 4, "22 Sep", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Luggage & Transfers", "Pre-Trip Planning"], "Yes, our app was not updated to reflect our accommodation at Koguchi Shizen-no-Ie. After spending about an hour locating the phone box and calling our accommodation at Takada Green Land as per the information in our app, we were told we had no booking. On cross checking with our written information, which we received at Kii-Tanabe, we discovered we were booked into Koguchi Shizen-no-Ie which was close by and delightful. It is a shame we lost that hour (if people are staying there, you need to improve your directions to find the phone box & is this even necessary if people have a mobile phone), and then the stress of wondering where our bags had been sent and where we were to stay. Easily resolved in the end but unnecessary stress."], ["Patricia Walton", "UK (Coast to Coast)", 4, "22 Sep", "Constructive", ["Itinerary & Route Info Accuracy", "Food & Meals", "Luggage & Transfers", "Pre-Trip Planning", "Value & Pricing"], "It would be more useful and better value for money to get all info for each stage in one document. We needed to check multiple pages that had also been sent on different dates to cobbled together critical planning for the day. Eg booking meals in advance is fine but searching for info on the distance in order to estimate eta cumbersome."], ["Erica Walton", "UK (Coast to Coast)", 4, "21 Sep", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Value & Pricing"], "Tidy up details, some places lusted on map wete not operating.  Felt like it was a one model fits all however the model needed to be altered and tailor made for the money spent!"], ["Phil Tangney", "Puglia (Italy)", 5, "21 Sep", "Negative", ["App & Navigation", "Accommodation"], "The GUIBO App \u2018navigate to your hotel\u2019 feature (when it automatically displays) never worked, always got the Oooops error comment even when 100m from hotels"], ["Amanda Fitzgerald", "Slovenia", 5, "21 Sep", "Positive", ["No improvement needed"], "Nothing springs to mind."], ["Sharon McLay", "Australia", 5, "21 Sep", "Constructive", ["Food & Meals"], "Food provided at the Great Ocean Retreat.  Not a lot of variety for dinner meals & all vegetarian"], ["Gavan Cramer", "Camino (Spain)", 5, "20 Sep", "Negative", ["App & Navigation", "Accommodation"], "Minor thing, the front page of the App is difficult to read with overlapping text, same as 2 years ago. Also, having to book into the accommodation in Grandas on line was impossible with only 3G and wifi only eSIM."], ["Judy Hambley", "Nakasendo Way (Japan)", 5, "20 Sep", "Positive", ["No improvement needed"], "Not really thankyou"], ["Alan Hambley", "Nakasendo Way (Japan)", 5, "20 Sep", "Constructive", ["App & Navigation", "Luggage & Transfers", "Weather, Safety & Conditions"], "Some of the instructions on the app about timing of connecting trains needs to be altered"], ["Neville Carlier", "Norway (St Olav)", 5, "19 Sep", "Positive", ["No improvement needed"], "no"], ["Sue Meehan", "UK (Coast to Coast)", 5, "19 Sep", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The app does not provide distances or mark elevation according to path taken. We mostly used All trails. App maps deviated from C2C path also in places."], ["Viv Hodge", "Puglia (Italy)", 5, "19 Sep", "Positive", ["No improvement needed"], "No"], ["Cecilia Carroll", "Australia", 4, "18 Sep", "Negative", ["Food & Meals"], "My only complaint was to do with the food at the retreat. I am not a vegetarian, but that is the only meals that were supplied. All lunches & dinners were made with cheap grocery items such as legimes, rice & pasta, with no meat and very few vegetables. Although the meals were mostly tasty & were presented well, they played havoc with my digestion & offered no variety."], ["Maria Lynam", "Dolomites (Italy)", 4, "17 Sep", "Negative", ["Accommodation", "Food & Meals"], "Food at base hotel was poor;"], ["Gill Hunt", "Camino (Spain)", 5, "17 Sep", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Food & Meals", "Local Support & Communication", "Guides & Group", "Luggage & Transfers", "Weather, Safety & Conditions"], "We would have really liked to see the Kms to be walked as a total each day on the travel app. We had to go back to the orginal email to find that information out. It could be on the Day by Day section before you click through to the details - eg San Sebasti\u00e1n to Orio (17km). We had a few issues  - Mirotza Appartments in Orio did not provide breakfast, the local guide only contacted us when we were well on our way instead of at the start the walk, we also had an awkward time with the taxi driver who had been booked for our rest day and then when plans changed, he was not cancelled. He turned up and was pretty cross he had been let down. Some of the estimated kms day were incorrect as they did not include getting to our hotel\u2026the one very long day was Gernika to Lezama\u2026in fact we had to go the next town Zamudio, which made the day a 24km day.  The last part from Larrabetzu was very hot, not attractive and perhaps a suggestion of a public bus from there would have been better as an option. It was too far! They only regret information that was internet was that about the hotel in Zumaia, which said that it had a restaurant providing local  cuisine and was a dining option. The restaurant seems to be closed permanently and they only offer breakfast."], ["Marie Wyatt", "Mont Blanc (France)", 5, "17 Sep", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation", "Guides & Group"], "As previously discussed, one hiker was clearly not physically able to hike on this trip I think she did 2 days. This affected the whole group. And me as I was her room mate. This trip was not suitable for her, I think she gave false information about her fitness. She was 81 years old."], ["Virginia Williams", "Camino (Spain)", 5, "17 Sep", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "See above re app better walking information. Map was good but needed details of days walk ."], ["Ken Holzheimer", "Mont Blanc (France)", 5, "17 Sep", "Positive", ["No improvement needed"], "No"], ["Janine Kent", "Kumano Kodo (Japan)", 4, "17 Sep", "Constructive", ["Food & Meals", "Weather, Safety & Conditions"], "The type of lunch provided on hot days with high humidity without refrigeration may need to be reconsidered. Raw fish ?"], ["Trent Thorne", "Nakasendo Way (Japan)", 5, "15 Sep", "Constructive", ["App & Navigation"], "The app should load up on the maps a bit quicker - every time you did not use it for 15 minutes, it would require you to go back through the start up page again."], ["Jenny Newton", "Mont Blanc (France)", 5, "15 Sep", "Constructive", ["Other / General"], "Screen walkers more thoroughly"], ["Edward King", "UK (South West Coast Path)", 5, "13 Sep", "Negative", ["Other / General"], "Accom out of towns sometimes a problem ."], ["Mike Kalms", "Camino (Spain)", 5, "13 Sep", "Positive", ["No improvement needed"], "no"], ["Grant Mills", "Via Francigena (Italy)", 5, "13 Sep", "Constructive", ["Itinerary & Route Info Accuracy"], "on trail signage not always clear"], ["Matthew Faddy", "Camino (Spain)", 5, "13 Sep", "Positive", ["Other / General"], "No it was a great trip. Look forward to using Raw again."], ["Elizabeth Yochum", "Mont Blanc (France)", 5, "12 Sep", "Positive", ["No improvement needed"], "No I can\u2019t think of anything."], ["Robert Graauwmans", "Mont Blanc (France)", 5, "12 Sep", "Positive", ["No improvement needed"], "No"], ["Christine Butler", "Dolomites (Italy)", 5, "11 Sep", "Negative", ["Value & Pricing"], "No - we had a participant who insisted on his mate joining in for some hikes which was very annoying for the rest of us as we had all paid and a lot of us didn\u2019t know his mate. Hopefully Julien got a good tip!"], ["Peter Coulson", "Camino (Spain)", 5, "11 Sep", "Constructive", ["Other / General"], "I don\u2019t think so"], ["Meredith Carlier", "Norway (St Olav)", 5, "11 Sep", "Constructive", ["Other / General"], "See comments made by Neville to lRuben."], ["David Moffitt", "Switzerland", 5, "10 Sep", "Positive", ["No improvement needed"], "No"], ["Lee  Smith", "UK (Coast to Coast)", 5, "08 Sep", "Constructive", ["Local Support & Communication"], "No, we felt well prepared by staff and supporting documentation.  We also felt supported throughout the trip."], ["Lee  Smith", "UK (Coast to Coast)", 5, "08 Sep", "Constructive", ["Other / General"], "Everything worked from start to finish. We expected it and you delivered."], ["Julie Wright", "Camino (Spain)", 5, "08 Sep", "Constructive", ["Accommodation", "Food & Meals"], "Accommodation closer to town if hotel does not provide a restaurant or meal service"], ["Cathie Cohn", "Switzerland", 5, "07 Sep", "Positive", ["No improvement needed"], "No"], ["Jan Batchelor", "UK (Coast to Coast)", 5, "07 Sep", "Positive", ["Other / General"], "No! Our experience was awesome in every way! Thank you!"], ["Mel Venn", "Switzerland", 5, "07 Sep", "Negative", ["Luggage & Transfers"], "bags were dirty and abraded/scraped after luggage transfers, didn't look like much care was taken with them."], ["Cathy Oster", "UK (Coast to Coast)", 4, "06 Sep", "Negative", ["Guides & Group"], "A second guide for the more difficult parts."], ["Fiona Campbell", "UK (Coast to Coast)", 5, "06 Sep", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation", "Luggage & Transfers", "Weather, Safety & Conditions"], "Raw should have given proper general information about how international travellers can arrive and depart the tour. Eg train schedules from major stations and bus timetables. Insufficient effort was made by RAW to accommodate twin share when requested instead of charging single supp."], ["Robert McConnochie", "UK (Coast to Coast)", 5, "06 Sep", "Positive", ["No improvement needed"], "No"], ["Randi Alsnes", "UK (Coast to Coast)", 5, "02 Sep", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Guides & Group"], "my first feedback was not finished, it just disappeared when i press enter to change paragraph. i continue. the walking speed varied quite a bit, so it is not easy to have only one guide, even that Rachel is super, sporty and strong. when it comes to the app, it should be more uppdated. some places the app showed former official route, and alterantive routes was not easily understood. happily we had a clever guide.  when it comes to pre-tour information, it will be useful to have more detailed information of every day, how many steep up and down hills to expect, and when they comes. 700 m elevation feels different with two steep ones, instead of slight upwards over 10-12 km."], ["Randi Alsnes", "UK (Coast to Coast)", 5, "02 Sep", "Negative", ["Itinerary & Route Info Accuracy", "Accommodation", "Guides & Group"], "When accomodations is spread in diferent villages, RAW shoud have arranged transport for people hwo stayed elsewhere. It is aboslutely unprofessional from RAW, that our nice guide had to solve this problem herself. when we have walked 20 km up and down hills, we do no want to walk anorther 3-4 km to reach accomodation, and walk the same distance back the next morning, to reach the path."], ["Karen Walsh", "Camino (Spain)", 4, "02 Sep", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Food & Meals"], "Just the app and perhaps update documents re hotels. A few of the descriptions were wrong as to whether or not the had restaurants and or pools. The last hotel in Llanes doesn't have pool and does have a restaurant. In Guemes the hotel had a restaurant but there was no other restaurants. Then info"], ["Marina Farnan", "Via Francigena (Italy)", 5, "02 Sep", "Constructive", ["Accommodation", "Luggage & Transfers"], "Not really apart from accommodation comments above. Various stages of the walk were closer to the freeway than I would have liked but that\u2019s not Raw travel issue. In the other side, I found the historical aspects of the walk and the small towns far more interesting than I\u2019d expected."], ["Shirley Valicevic", "Camino (Spain)", 5, "31 Aug", "Constructive", ["Accommodation", "Food & Meals"], "Offered dinners in the remote areas where we had to rely on the place we were staying because there were no other options."], ["John Colyer", "UK (Coast to Coast)", 4, "30 Aug", "Negative", ["Accommodation"], "We were disappointed with accommodation in Ingleby Farm and being hustled by Potato Dave at Patterdale."], ["John Colyer", "UK (Coast to Coast)", 4, "30 Aug", "Negative", ["Accommodation"], "We were disappointed with accommodation in Ingleby Farm and being hustled by Potato Dave at Patterdale."], ["Timothy Vanderkley", "Mont Blanc (France)", 5, "30 Aug", "Constructive", ["Itinerary & Route Info Accuracy", "Guides & Group", "Luggage & Transfers"], "My fitness level was very different to the rest of the team that I was put with, I often wanted to go faster and I didn\u2019t like taking taxis/minimising the walking distance. I understand that this was done to help those in the team with less fitness levels, but if I had a choice, I would\u2019ve preferred not to have ever taken a Taxi and to walk at my pace."], ["Natalie Osborne", "Mont Blanc (France)", 5, "29 Aug", "Constructive", ["Guides & Group"], "I don\u2019t know if this coukd have been managed. But I found out later, that two of the guys were having some macho competition with each other and racing each other on the hike, to the point of their own exhaustion it turns out. This had implications for all of us and made the hike much faster and probably more challenging for some of us, than necessary. I\u2019m not sure if Dave was aware, but just a heads up if this happens in future. I guess some people never grow up. Having said that, Dave was great at managing such a diverse group. I had a great time!"], ["Max  Cameron", "Camino (Spain)", 4, "26 Aug", "Constructive", ["Other / General"], "RAW sell a product. That is fine. It would be great to get a bit more individual tailoring."], ["Denise Raybould", "Mont Blanc (France)", 5, "20 Aug", "Positive", ["No improvement needed"], "Nothing specific"], ["Andrew Hughes", "Mont Blanc (France)", 5, "20 Aug", "Positive", ["No improvement needed"], "Not that I can think of."], ["Margaret Walker", "Mont Blanc (France)", 5, "19 Aug", "Constructive", ["Luggage & Transfers", "Weather, Safety & Conditions"], "I really noticed the heat and the altitude. A more intense pre-training regime may have helped. I followed the RAW programme, but I don\u2019t think it\u2019s intense enough!"], ["Jenny Ryan", "Mont Blanc (France)", 5, "19 Aug", "Negative", ["Other / General"], "I am sorry that I couldn't participate in the walk beyond the first day but none of that was to do with RAW - was just my bad luck."], ["Steve Cable", "UK (Cotswolds)", 5, "18 Aug", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy"], "App was useless on a lot of occasions either out of date or indicating the wrong direction so I followed the signs."], ["Steve Cable", "Camino (Spain)", 5, "18 Aug", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy"], "I found the App on this trip and also the Cotswold Way to be out of date on a lot of occasions so I eventually gave up and followed the signs"], ["Mike Kalms", "UK (Hadrians Wall)", 5, "16 Aug", "Constructive", ["Other / General"], "No, you guys have a good set up.  I\u2019m walking Sri Lanka in November with a different mob, be interesting to see how you compare, I expect favourably"], ["Greville Pabst", "Slovenia", 4, "14 Aug", "Constructive", ["Local Support & Communication", "Luggage & Transfers"], "More thought perhaps needs to go into your ground staff. We found they were not helpful at all. On introduction, all they provided was a couple of luggage tags and a bag to put rubbish in along the hike.  Really the meeting was meaningless which was not what we were expecting.  When I needed assistance, they said that they had not been confronted with the issue before and did not know what to do.  Revisiting who you have in charge and their capabilities would be beneficial."], ["Anne (Annie) Clarke", "Norway (St Olav)", 5, "13 Aug", "Constructive", ["Other / General"], "Personally, I would\u2019ve liked the opportunity to take a couple of rest days - day 4 and day 6 or 7. There are accomodation options where this would have been great - a day to re-charge and rest sore muscles and do some laundry!!"], ["Patricia (Tricia) Perl", "Via Francigena (Italy)", 5, "12 Aug", "Constructive", ["Accommodation"], "Not really, maybe just a check in on some of the hotel accom to see that they are still ok."], ["ROZ PATTERSON", "Camino (Spain)", 5, "11 Aug", "Constructive", ["Accommodation"], "No Liz. As above we may just ask a few different things next time in regards to accommodation knowing there is only the two of us."], ["Sue Macmillan", "Slovenia", 5, "10 Aug", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Local Support & Communication", "Luggage & Transfers"], "We found communication with the company fantastic.  Eve was brilliant throughout.  Apps worked really well, drivers all friendly and full of local information. The additional information provided in the Trip Plans App was invaluable. The accommodation issues (generally minor) I will address in a further email"], ["Mick McCormack", "Okinawa (Japan)", 5, "09 Aug", "Constructive", ["Other / General"], "All very good."], ["Liz Hallett", "Via Francigena (Italy)", 5, "09 Aug", "Constructive", ["Other / General"], "No, this is our second time with Raw - we are big fans of the service"], ["Neil Ritter", "Dolomites (Italy)", 5, "09 Aug", "Constructive", ["Guides & Group"], "Happy with the trip and particularly with our guide"], ["Margaret Ritter", "Dolomites (Italy)", 5, "09 Aug", "Constructive", ["Guides & Group"], "Happy with the trip and particularly with our guide"], ["Chris Johnston", "Norway (St Olav)", 5, "09 Aug", "Constructive", ["Local Support & Communication"], "I have provided some other feedback to Amanda and will email her directly with some other suggestions. I think offering rest days would be good, and several of the places are well suited to a rest stop."], ["Peter Bell", "Via Francigena (Italy)", 5, "07 Aug", "Constructive", ["Luggage & Transfers", "Weather, Safety & Conditions"], "The above comment about timing and heat is relevant. Perhaps to have started in Lucca and walked back to the pass to go though the pass close to June 20 would work better.  The three days from Martigny to the pass were v demanding more like serious hiking than a Camino. Heat was even a factor here as well.  Brekky at Anand was mostly packaged product and Mortara they sent u to the railway cafe which was v limited and rough. There is a via Francigena office in Ivrea Fidenza and Lucca. They provide certificates and bits and pieces giveaways  we discovered them by accident.  I don\u2019t believe they are in the documentation. Worth a visit. There were some minor glitches with bags. S-cape v good. .i enjoyed it but with the heat the alps and the plains parts I would say slightly tougher than the del Norte."], ["Alan Camp", "UK (Coast to Coast)", 5, "07 Aug", "Constructive", ["Itinerary & Route Info Accuracy"], "The naming system for the alternate routes in the itinerary could be improved."], ["Melanie Trethowan", "UK (Coast to Coast)", 5, "06 Aug", "Constructive", ["Itinerary & Route Info Accuracy", "Accommodation", "Local Support & Communication", "Guides & Group", "Luggage & Transfers", "Value & Pricing", "Weather, Safety & Conditions"], "Stages: the stages/distance we had were good. A good mix of short and longer days.  \u2022Luggage transport \u2013 an excellent service and they didn\u2019t miss a beat the whole time. They are very strict on their 20kg limit and we did get one \u2018red card\u2019 at the start. \ud83d\ude0a \u2022Guided Day \u2013 our guided day was excellent. It was probably our toughest day as we chose the higher Haystacks route, plus it was VERY hot. An amazing day though and we really appreciated Rachel\u2019s knowledge and support. \u2022C2C Passport \u2013 please note we did try to buy the C2C passport at the St Bees post office, but the lady would not honour the 20% discount. I had printed out the promotional material etc, but she insisted we had to buy it online to get the discount. Consequently, we did not buy a passport. The exchange rate really makes this an optional extra, not a must have. \u2022Accommodation snaffu \u2013 one small accommodation snaffu at the Lion Inn on Blakey Ridge. We were allocated a double bed as the staff said that Room 9 had been specifically requested by the Company. It was no biggie as we were then given a twin room. It would have been more of an issue if they were fully booked. \u2022Overall, we had an amazing time. The weather was damn near perfect and no rain the entire trip \u2013 some sort of World record. Thanks so much for your skill and knowledge of this part of the UK and the walk in general."], ["Melanie Trethowan", "UK (Coast to Coast)", 5, "06 Aug", "Constructive", ["Itinerary & Route Info Accuracy", "Luggage & Transfers"], "Stages: the stages/distance we had were good. A good mix of short and longer days."], ["Peter Fall", "Michinoku Coastal Trail (Japan)", 5, "04 Aug", "Constructive", ["Local Support & Communication"], "Yeah, I don't think so. It was really fantastic. The support that RAW offered certainly exceeded my expectations."], ["Cynthia Moncrieff", "Camino (Spain)", 5, "04 Aug", "Constructive", ["Itinerary & Route Info Accuracy"], "I had bought the John Brierley book many years ago and it was invaluable in looking at the various routes we could take, and the points of interest which different to those highlighted by RAW in done cases."], ["David Paynter", "Camino (Portugal)", 4, "03 Aug", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy"], "Daily distances difficult to work out and mot on the app. Used the 'your route' when walking. Individual routes need to be either relabelled to be applicable or accessible from the main overall route section of the app"], ["David Paynter", "Camino (Spain)", 4, "03 Aug", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy"], "Daily distances difficult to work out and mot on the app. Used the 'your route' when walking. Individual routes need to be either relabelled to be applicable or accessible from the main overall route section of the app"], ["Jenny Bobridge", "UK (Coast to Coast)", 5, "03 Aug", "Constructive", ["App & Navigation", "Accommodation"], "As mentioned above with accommodation. The app was sometimes quite off track, even though we were following the Coast to Coast signs."], ["Susan McCabe", "Michinoku Coastal Trail (Japan)", 5, "02 Aug", "Positive", ["No improvement needed"], "No, nothing"], ["Richard Sharp", "Dolomites (Italy)", 5, "30 Jul", "Positive", ["No improvement needed"], "Nothing, it was brilliant, highly recommend."], ["Hadyn Siggins", "UK (South West Coast Path)", 4, "30 Jul", "Negative", ["Itinerary & Route Info Accuracy", "Guides & Group", "Luggage & Transfers", "Pre-Trip Planning", "Value & Pricing"], "Big issue was the baggage limit. We were travelling internationally for a number of weeks prior to the walk and thus had a large luggage set. We had seen the comment about 20 kg maximum bag, however there was no additional information about the result of exceeding that limit. Thus it seemed like a guide rather than a limit. There is no indication of any additional costs if the limit was exceeded again leading to the indication that it was more of a guide than a hard maximum. Thus very disappointed to receive an invoice for additional costs afterwards."], ["Chris Locke", "Mont Blanc (France)", 5, "30 Jul", "Constructive", ["Other / General"], "No - team were very responsive to any questions as arose"], ["Michael Orey", "UK (Coast to Coast)", 4, "30 Jul", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Guides & Group"], "Again, overall I had a good experience, but the Raw Travel app for this trip was seriously deficient in two ways: (1) DESIGN: The app should have had a separate link for each segment of the trip -- on my trip, we had 16 wallking days, so there should have been 16 separate map segments to click on. And each segment should have provided information about total distance elapsed/remaining as well as elevation info. FUNCTION: The app was very clunky to use -- it took multiple clicks to open to the trail guide. The app frequently shut itself down and had to be relaunched. And, worst of all, it frequently failed to show my location accurately -- sometimes showing me to be in the middle of nowhere, when I was clearly right on the trail. Also, others walking with me who had the Raw app sometimes were shown to be in a different location than me. Additionally, if I could want to pinch the screen to zoom in on my location, that often freaked the app out and it reverted to the entire UK map or displayed something else totally away from my actual location. People I walked with who had done your Nakasendo Way trip said the Raw app was excellent for that trip, but they agreed that it was very glitchy for the Coast to Coast."], ["Andrew Nelson", "Camino (Spain)", 5, "29 Jul", "Negative", ["App & Navigation", "Accommodation"], "The app was a little bit clunky, and a bit confusing to use at first, with the two sets of maps. Also having to log in again just to move from one set of map(s) to the other. it was not initially clear which map showed our accommodation, but we worked it out in the end."], ["Steve Jackson", "Dolomites (Italy)", 5, "28 Jul", "Positive", ["No improvement needed"], "Nothing"], ["Evangeline Maguire", "Camino (Spain)", 5, "27 Jul", "Positive", ["Other / General"], "We loved it so much and it\u2019s the highlight of my trip. Cant wait to use RAW again on another trip."], ["Karen Siggins", "UK (South West Coast Path)", 5, "26 Jul", "Constructive", ["Itinerary & Route Info Accuracy", "Weather, Safety & Conditions"], "We thought the daily route descriptions could have been more specific to the actual route we travelled each day - there seemed to be a catch all description for the first three days that did not reflect the actual terrain - could have been more curated"], ["Carol Johnston", "Norway (St Olav)", 4, "26 Jul", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Weather, Safety & Conditions"], "Resolve app issue, work with Norwegian camino organization to update route changes, arrange accommodation close to trail (due to challenges route finding in rough terrain)"], ["Sue Finlayson", "Norway (Lofoten)", 5, "23 Jul", "Constructive", ["Other / General"], "I loved every minute of the trip, challenging, great scenery and well organised.  I think that it needs to be reinforced that a high level of hiking fitness and leg strength is paramount - its HARD. Plus injury free - no dodgy hips/knees/ankles as it just makes some of the days impossible to participate in"], ["Peter Lodewijks", "Mont Blanc (France)", 5, "22 Jul", "Positive", ["No improvement needed"], "No"], ["Ross Moncrieff", "Camino (Portugal)", 5, "20 Jul", "Constructive", ["Itinerary & Route Info Accuracy"], "The actual distance walked daily was often longer than the RAW summary."], ["Nicola Hay", "Norway (Lofoten)", 4, "19 Jul", "Negative", ["Itinerary & Route Info Accuracy", "Food & Meals"], "A more thorough description as to why the walk was graded challenging, with the emphasis on boulders. The 2027 brochure I think is better than what I recall from the 2026 version. The info was also misleading as there was minimal authentic Nordic cuisine (although the standard of in-house catering was very good)."], ["David Wilson", "Mont Blanc (France)", 5, "19 Jul", "Positive", ["No improvement needed"], "No"], ["Mary Del Dosso", "Mont Blanc (France)", 5, "19 Jul", "Constructive", ["Guides & Group"], "Raw team were fantastic. I personally was not ready mentally nor physically but somehow through the group and team lead I pulled through\u2026"], ["Jola Koegelenberg", "Camino (Spain)", 4, "17 Jul", "Constructive", ["Accommodation"], "Standard of accommodation was not always up to scratch. We did not expect 5 star accommodation, but cleanliness and basics are not negotiable for us"], ["Veronica Tam", "Michinoku Coastal Trail (Japan)", 5, "16 Jul", "Positive", ["No improvement needed"], "No"], ["Karyn Concanen", "Camino (Spain)", 5, "16 Jul", "Constructive", ["App & Navigation", "Accommodation"], "Maybe a check in via app"], ["Jo-Anne Hamilton", "Camino (Spain)", 4, "14 Jul", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The App needs to be updated to include the most current routes - both original and alternate"], ["Debra Cutting", "Norway (St Olav)", 5, "14 Jul", "Constructive", ["App & Navigation"], "A physical map would have been most useful."], ["Jack Jurcola", "Kumano Kodo (Japan)", 5, "13 Jul", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The app was a little confusing as I had multiple routes and didn't know what the right one was.. Day 3 didn't provide a recommended start time. But my trip went smoothly"], ["Jeanette Rogers", "Camino (France)", 5, "12 Jul", "Positive", ["No improvement needed"], "No very happy with Raw Travel"], ["Karen Crossley", "Norway (Lofoten)", 4, "12 Jul", "Negative", ["Itinerary & Route Info Accuracy", "Weather, Safety & Conditions"], "More variety in terrain. Some smooth through hikes. Can be long and or climbing but no scrambling."], ["Julie Sleigh", "Dolomites (Italy)", 5, "12 Jul", "Constructive", ["Itinerary & Route Info Accuracy", "Guides & Group"], "Di was an outstanding guide! Her knowledge of the region interns of flora and fauna together with the history was beyond incredible. Her care, instruction and ability to bring a group together was second to none. Pre hike information was comprehensive and overall could not have come away any happier either our experience. Thank you!"], ["David Scott", "UK (South West Coast Path)", 5, "12 Jul", "Constructive", ["Itinerary & Route Info Accuracy"], "Keeping up to date with trail deviations."], ["Annette Gilmour", "Camino (Spain)", 5, "12 Jul", "Constructive", ["Itinerary & Route Info Accuracy"], "If I was planning it again, I\u2019d try not to walk such long distances on the first four days. We probably should have allowed ourselves to get into the rhythm of continual walking by starting off with shorter distances first."], ["Annette Gilmour", "Camino (Spain)", 5, "12 Jul", "Constructive", ["Itinerary & Route Info Accuracy"], "If I was planning it again, I\u2019d try not to walk such long distances on the first four days. We probably should have allowed ourselves to get into the rhythm of continual walking by starting off with shorter distances first."], ["FIONA EDWARDS", "Norway (Lofoten)", 4, "12 Jul", "Constructive", ["Accommodation", "Food & Meals"], "as mentioned focus on better accommodation, more fresh sourced foods, a more comfortable van"], ["Elizabeth Scott", "UK (South West Coast Path)", 5, "11 Jul", "Constructive", ["Itinerary & Route Info Accuracy"], "Not really. We were very satisfied with the information & organisation. Arranging a better exchange rate for the A$ to the UK pound would be good but beyond your remit!"], ["Louise Guy", "UK (Hadrians Wall)", 5, "11 Jul", "Constructive", ["Accommodation"], "Note - the kilometres travelled each day was a lot more that advised for the first section (Carlisle) and last section Newcastle due to the accommodation being  away from the trail."], ["David Scott", "UK (South West Coast Path)", 5, "10 Jul", "Constructive", ["Itinerary & Route Info Accuracy", "Weather, Safety & Conditions"], "Update Padstow to Portcothan (route out of Padstow part closed)"], ["Lorraine Hanlon Larke", "Camino (Spain)", 5, "10 Jul", "Negative", ["Other / General"], "Only 1 error when walking into Bergos, we took the road option into the industrial area, but spoke to others who walk along the river"], ["Anna Tushuizen", "Camino (Spain)", 5, "09 Jul", "Constructive", ["Accommodation", "Luggage & Transfers", "Pre-Trip Planning", "Value & Pricing"], "I was very lucky to be offered a twin room without having to pay a single supplement. It would have been helpful to have been advised prior to leaving that I was in a twin room on my own, as one traveller had a single room and the other two travellers a twin room. It did cause issues at various places along the way as hotel staff were not able to understand it why there were 2 twin rooms for 3 people. At one place the check in staff were so confused they ended up calling Daniel (we think) to sort it out. Otherwise I was really impressed by how everything went with the luggage transfer and our great accommodation."], ["Donna Dunn", "UK (Coast to Coast)", 5, "09 Jul", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "Would be handy for the app to include daily elevations as well as distances"], ["David Small", "Camino (Spain)", 5, "09 Jul", "Constructive", ["Accommodation"], "It must be hard to accommodate the 6 RAW people who started the same day, but I felt in a couple of places, the ladies got better accommodation than I did. Overall mine was fine, but one or two weren't as good"], ["Ryah Perkiss", "Camino (Spain)", 5, "09 Jul", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "It wasnt clear where to find the pilgrims office - perhaps provide these details in the information as it doesnt show up in apple / google maps."], ["Lucy Hackney", "Camino (Spain)", 5, "09 Jul", "Constructive", ["Local Support & Communication", "Luggage & Transfers"], "Other than making sure our bags were delivered to the right place. This was on a weekend so we wouldn\u00b4t have been able to contact Raw till the monday."], ["Jessica Seaton", "Camino (Spain)", 5, "09 Jul", "Positive", ["No improvement needed"], "No. It was a great experience."], ["Amanda Garland", "Camino (Spain)", 5, "08 Jul", "Negative", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Weather, Safety & Conditions"], "The RAW app, particularly the mapping is really not useful.  Suggest you just partner with one of the campanies with better mapping, such as Buen Camino. Often the app would not open at all and accuracy of mapping was not good enough to navigate by. Weather only showing \u201cday of\u201d was not useful for planning ahead. Hotel information on app was good, but also had access to pdf so did not really need the app."], ["John Dobies", "Mont Blanc (France)", 5, "08 Jul", "Constructive", ["Food & Meals", "Guides & Group"], "The walking and guiding were superb. The chosen restaurants less so. I have to say that Di McGuiness could not be improved upon as a leader. She was both highly competent and caring."], ["Michelle Luff", "Norway (Lofoten)", 5, "08 Jul", "Negative", ["Local Support & Communication"], "The first day was a big travel car day and I would have been happy to make our own way to Svolvaer and meet everyone there. Alternatively start the hike from there.  Perhaps have some additional suggestions if people would like to arrive pre or post hike. It is such a beautiful part of the world and a long way to go just for a hike. I would love if there was an option for past/future hikers to leave recommendations of other things to see / do. This is how I tend to book our hikes so tips on different locations would be a bonus, sometimes it is difficult to research what you do not know & the hidden gems."], ["Melissa McClusky", "Camino (Spain)", 5, "07 Jul", "Positive", ["No improvement needed"], "No"], ["Lorraine Hanlon Larke", "Camino (Spain)", 5, "07 Jul", "Constructive", ["Itinerary & Route Info Accuracy"], "There is a choice about 5ks from Burgos and one sent us past the airport on the main road through an industrial area, Others we spoke too knew the route to walk by the river, we didn\u2019t know there was a choice"], ["Bernard Marshall", "UK (Hadrians Wall)", 5, "07 Jul", "Constructive", ["App & Navigation"], "The app needs some work. In particular it would be good to have the elevation map for each day individually so you can see what the day will bring."], ["Wayne Marshall", "Camino (Spain)", 5, "06 Jul", "Constructive", ["Other / General"], "Hmm\u2026. Not really"], ["Robert Seeley", "Camino (Spain)", 5, "05 Jul", "Constructive", ["Accommodation", "Food & Meals"], "Perhaps in some locations we would have been better to save on the breakfasts provided and sought our own. RAW would know which nights accommodation are likely to be below expectations and a heads up on these would have be"], ["Sandra Thefs", "Mont Blanc (France)", 5, "05 Jul", "Constructive", ["Local Support & Communication", "Luggage & Transfers"], "For some reason the email and sms from CVT for my initial airport pickup didn\u2019t come through until I got back to Australia. It would be great if they could use WhatsApp messaging. No big deal - I asked various people in Geneva airport until I found the usual CVT meeting spot for pick-up."], ["RACHAEL GOTH", "Mont Blanc (France)", 5, "05 Jul", "Positive", ["No improvement needed"], "No. It was all amazing."], ["Sandi VanderVelde", "Nakasendo Way (Japan)", 5, "04 Jul", "Negative", ["Accommodation", "Value & Pricing"], "I think mainly the final ryokan was the only disappointment, possibly an upgrade for this town would be an improvement"], ["Louise Hanrahan", "Slovenia", 5, "03 Jul", "Constructive", ["Other / General"], "Thoroughly enjoyed it and have been highly recommending it to friends and family. I would like to tackle a more challenging walk next time. My only feedback was that some of the days, especially the last day of the trek were too short."], ["Anne Andrews", "UK (Cotswolds)", 5, "03 Jul", "Negative", ["Itinerary & Route Info Accuracy", "Food & Meals", "Luggage & Transfers", "Weather, Safety & Conditions"], "There was extreme heat for the first part of our trip so I think you should let people know that the weather means travel is impacted. On day one from Stratford upon Avon to Camden  we left early. White breakfast - they said we could take a packed breakfast early but then didn\u2019t open until after 8- and nothing was open on the route.  The quiet. Country lane advised for the alternative route was a busy rush with trucks and was dangerous to walk along. This was the only bad bit of the route.  Unfortunately due to the weather even the attractions like Hidcote gardens were closed so we had no food or water options other than efst we took with us until we got to Camden. The only bus route along the path was infrequent- we would have had to sit in the the heat for over 3 hours for the bus so there really weren\u2019t any options but to walk."], ["Bernard Roberts", "Camino (Spain)", 4, "03 Jul", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation", "Guides & Group", "Pre-Trip Planning"], "In addition to comments on O Pedrouzo accommodation & RAW travel app above, propose that access to pre trip detail information should be available greater than the advised 4wks prior to trip. As we travel for many months at a time, the potential for receiving this information after our departure from Australia, would be a reason why we would consider not using RAW as a trip provider. We have used multiple other travel providers for self guided walking tours & RAW is definitely out of step with what the rest of the industry provides in this area"], ["Jane Hewitt", "UK (South West Coast Path)", 5, "02 Jul", "Negative", ["Accommodation", "Food & Meals", "Weather, Safety & Conditions"], "St Ives to Zennor walk was only 11km and despite leaving St ives fairly late and no rushing we arrived 2 hours before accommodation checkin so had to amuse ourselves in bad weather with not much to see and do. although Land's end to Porthcurno was only 9km we left late,stopped at Porthgwarra for coffee ,visited MInack and the PK museum which was very interesting and worthwhile,so despite a short walk it was an interesting day.We do however  understand the walking day may be governed by accommodation options.       erstand the"], ["Jane Hewitt", "UK (Hadrians Wall)", 5, "02 Jul", "Constructive", ["Accommodation", "Food & Meals", "Luggage & Transfers", "Pre-Trip Planning", "Value & Pricing", "Weather, Safety & Conditions"], "On first day of walk requiring taxi or bus from Carlisle it would help to have transport prearranged. gettng the bus means the waking doesn't start until probably 10:30am.We wanted to start earlier but booking a taxi the day before was impossible as they all have contracts to do school runs or don't even pickup. No taxis at train station in morning but we were lucky to get one who kindly changed his arrangements and took us.The hosts at B&Bs were all lovely.Julie at roselind house let us leave luggage,Diane at Scotch Mews had a great set up with lounge allowing your own meals to be brought in and purchase of drinks.dacre house also had lounge and drinks but check in not until 4:00pm which normally wouldn't matter but we only walked 12.0k that day and got in at 2:00pm  and that was with stopping for a long time at Birdswald Fort and we had stopped at Lanercost priory in morning.Also would not recommend walking to Brampton from priory for safety reasons on road.there is a bus. Claire's breakfast at Dacre very good with varied options.Twice brewed dinner food very good.Leslie at hadrian's barn provided the best and most generous evening meal and very well priced."], ["Jane Hewitt", "UK (Hadrians Wall)", 5, "02 Jul", "Constructive", ["Luggage & Transfers", "Pre-Trip Planning", "Weather, Safety & Conditions"], "On first day of walk requiring taxi or bus from Carlisle it would help to have transport prearranged. gettng the bus means the waking doesn't start until probably 10:30am.We wanted to start earlier but booking a taxi the day before was impossible as they all have contracts to do school runs or don't even pickup. No taxis at train station in morning but we were lucky to get one who kindly changed his arrangements and took us."], ["Hilary Grant", "UK (South West Coast Path)", 4, "02 Jul", "Constructive", ["Itinerary & Route Info Accuracy", "Food & Meals"], "More information about local towns eg where to buy lunch,are there any cafes on walk and general local knowledge"], ["Avinash Ramcharan", "Camino (Spain)", 5, "02 Jul", "Constructive", ["Local Support & Communication"], "Overall, everything was great and I would like to make a special mention of Daniel Arias (your contact point in France / Spain). He was incredibly helpful and very supportive."], ["Maureen Lorimer", "Camino (Spain)", 5, "01 Jul", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "There were a couple of occasions when the travel app took an indirect route to reach the destination otherwise the app was very good."], ["Peter Wood", "Camino (Spain)", 5, "01 Jul", "Constructive", ["Local Support & Communication", "Pre-Trip Planning"], "More frequent pre-trip communications."], ["Caroline Austin", "Camino (France)", 5, "30 Jun", "Positive", ["No improvement needed"], "No"], ["Randal Jones", "Nakasendo Way (Japan)", 5, "30 Jun", "Constructive", ["Luggage & Transfers"], "If we could have avoided backpacks and used luggage with rollers that would have been better. Everything else was absolutely awesome."], ["Deb Chapman", "UK (Coast to Coast)", 5, "30 Jun", "Constructive", ["Accommodation", "Luggage & Transfers"], "Combined hotel stays into two nights in one place instead of single nights in hotels which were less than 5 miles apart and both of which required a private vehicle transfer"], ["Louise Jones", "Nakasendo Way (Japan)", 5, "30 Jun", "Negative", ["App & Navigation", "Local Support & Communication"], "GPS emergency tracker ?? Rolling suitcases were used by other travelers. We found the backpack/soft suitcases troublesome"], ["John White", "Camino (France)", 4, "30 Jun", "Negative", ["Accommodation", "Local Support & Communication"], "Less cut and paste and more curated for us. Too many accommodations did not meet the standard we expected and two were very bad with one in particular leaving us with a feeling of being ripped off."], ["Claire Rankin", "Camino (Spain)", 5, "29 Jun", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "We had a great trip overall. We noticed the App worked really well for the first part of our walk on the Coastal hikes. But once we joined the central Portuguese route, there was occasions where the route differed significantly to the official camino signs. We chose to stick to the signs and ignore the App but some guidance on this would also be useful."], ["Durham Prewett", "UK (South West Coast Path)", 5, "29 Jun", "Negative", ["Accommodation"], "We were hopeful that our final accomodation in Falmouth would have been up to the standard of the final accommodation on the C2C but sadly no."], ["Alex Czarnecki", "Camino (Portugal)", 5, "29 Jun", "Constructive", ["Itinerary & Route Info Accuracy"], "More information about how much pavement walking was involved. This was the hardest part of the days. The natural paths were much easier on the body. But the pavement and road walking really took its toll."], ["Howard Treisman", "Mont Blanc (France)", 5, "29 Jun", "Constructive", ["Other / General"], "I think it's helpful to mention what plugs are in each location (all Euro except for Switzerland which has it's own specific plug type), and also where laundry can be done."], ["Dominic Cottam", "Mont Blanc (France)", 5, "29 Jun", "Positive", ["No improvement needed"], "no"], ["Shari VanderVelde", "Nakasendo Way (Japan)", 5, "29 Jun", "Constructive", ["Weather, Safety & Conditions"], "Day 3 on this trip is through small villages with absolutely no shade.  On a hot and humid day like my sister and I had, it is a bit miserable.  This can add to the memories and the overall experience, but I feel like heat stroke was a very real possibility.  Maybe an option to skip this day."], ["Jenny Stephenson", "UK (Cotswolds)", 4, "29 Jun", "Constructive", ["Accommodation", "Luggage & Transfers"], "Earlier check-in at hotels and rooms with less stairs to get bags up"], ["Alison Jennings", "UK (Coast to Coast)", 5, "28 Jun", "Constructive", ["Other / General"], "Don\u2019t think so"], ["JOSEPH ZINGARELLI", "Mont Blanc (France)", 5, "28 Jun", "Negative", ["Other / General"], "Nothing to improve  - except the shower size at La  Chaumiere!"], ["Jennifer Goodey", "UK (South West Coast Path)", 5, "28 Jun", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "It would be helpful to have a complete personalised itinerary both in print and on the app."], ["Luke Baker", "Norway (Lofoten)", 5, "27 Jun", "Constructive", ["Other / General"], "The accomodation arrangements let down what was otherwise a magnificent hike."], ["Nadia Baker", "Norway (Lofoten)", 5, "27 Jun", "Positive", ["Other / General"], "I have now done 6 trips with RAW and you are the best! I intend to do more. We are really spoilt for choice with RAW. Thank you!"], ["Roz Giles", "Camino (Spain)", 5, "26 Jun", "Positive", ["Other / General"], "No. It was well organized from start to finish. Bike hire was seamless and good back up when we had a few bike issues. Loved everything. We will book again."], ["Josie Presch", "Camino (France)", 5, "26 Jun", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "It would be good if the app had more information about distances in each section and topographic elevation mapping."], ["Julie Muller", "Camino (Spain)", 5, "26 Jun", "Constructive", ["Other / General"], "Service was very good"], ["Chris Mills", "Camino (Spain)", 5, "26 Jun", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "vertical data (profile info, mainly; but contours on the map would help too) could be easier to access in the app (I was unable to access it at all, though I didn't try very hard, as I have an All-Trails subscription so used that when I REALLY thought it was necessary).  Also, \"how far and how much are we signed up for to do today?\" questions were only answerable by visiting original e-mail summarizing itinerary AND using the All-Trails app.  I mostly didn't bother and just went for it, but it would have been nice."], ["MARK HUDSON", "Camino (Spain)", 5, "25 Jun", "Constructive", ["App & Navigation", "Accommodation", "Luggage & Transfers"], "A minor one - but the accomodation in O Pedrouzo - which you need to get picked up for. The description says it is 1.5klms from the track - we walked it and it is easily 3 klms - and once you get to the Hotel it is called Camino Hotel on the gate - and there is no button on the gate to get in - luckily the gate opened for a car to exit and we got in - once in all wentt fine - but it was not a smooth process to get there. Same for the other off the track Hotel - Hotel Rural Casa el Cura - we were on bikes so we could not use the transfer service - this meant a further 8-9 klms of riding - and it was not clear how to get there - we used Google Maps - which was different - got there in the end - but again not smooth. the hosts at both of these facilities however were very good - once there the experience was first class."], ["Samantha Mills", "Mont Blanc (France)", 5, "24 Jun", "Constructive", ["Guides & Group"], "There was one person in our group who was not really fit enough for the trails so maybe a little more personal discussion on fitness expectations would have given her a better idea of her own limitations.  Diane addressed this by giving the rest of us directions to go ahead which was still excellent but I just felt sorry for the one person who was really struggling."], ["Kerri I\u2019Anson", "UK (Hadrians Wall)", 5, "24 Jun", "Positive", ["No improvement needed"], "Not that I can think of"], ["Heather Algar", "Camino (Portugal)", 4, "23 Jun", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The App need work. Not always accurate, particularly the last couple of days into Santiago de Compostela."], ["Jo Debono", "UK (Cotswolds)", 5, "23 Jun", "Constructive", ["App & Navigation"], "The app needs some improvement. It was not always working on my Android phone."], ["Valerie Hughes", "UK (Hadrians Wall)", 5, "23 Jun", "Positive", ["No improvement needed"], "No"], ["Margaret Leamy", "Puglia (Italy)", 4, "23 Jun", "Negative", ["Other / General"], "The maintenance of bikes could have been better. My bike chain came off once everyday, and then on last day it came off 5 times. Once is fine but 5 was really annoying and made me a little grumpy."], ["Peter Gibson", "Norway (Lofoten)", 5, "22 Jun", "Constructive", ["Accommodation", "Guides & Group"], "We had a lovely group of people but is difficult when there is such a variation in expectations and walking experience. The guide did a great job accommodating the different needs of the group. I feel there needs to be alternate activities for those who cannot cope with the walks, because it seems people are going to sign up for this without the required fitness and experience."], ["Cathy Anne Grew", "Norway (Lofoten)", 4, "20 Jun", "Constructive", ["Itinerary & Route Info Accuracy", "Guides & Group", "Weather, Safety & Conditions"], "There was some mismatch of expectations in the group. That was worked through.  RAW had said the route was challenging but there were on occasion kilometres of very tough terrain.  The views were however absolutely spectacular.  Maybe at least one day in nine that was not a formal walking day.   There were lots of local things to see and do."], ["Elizabeth  Harris", "Michinoku Coastal Trail (Japan)", 5, "20 Jun", "Positive", ["No improvement needed"], "Nothing"], ["Mark Maclean", "Camino (Portugal)", 5, "20 Jun", "Constructive", ["Accommodation"], "Everything was amazing and we highly recommend RAW travel. It was just the one hotel I mentioned above that I wouldn\u2019t recommend."], ["Anna Morton", "UK (Coast to Coast)", 5, "20 Jun", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "Some of the coast to coast routes had changed and the app needs updating"], ["Katherine Cole", "Camino (Spain)", 5, "19 Jun", "Positive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The apps wasn\u2019t great so I usually got information from other travellers."], ["Katherine Cole", "Camino (Spain)", 5, "19 Jun", "Positive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "The apps wasn\u2019t great so I usually got information from other travellers."], ["Douglas Rolfe", "Nakasendo Way (Japan)", 5, "18 Jun", "Positive", ["No improvement needed"], "No"], ["Douglas Rolfe", "Michinoku Coastal Trail (Japan)", 5, "18 Jun", "Positive", ["No improvement needed"], "No"], ["Christine Grimes", "Camino (Portugal)", 5, "17 Jun", "Positive", ["No improvement needed"], "not really"], ["Catherine Barclay", "Camino (Spain)", 5, "16 Jun", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "With the app, on an apple phone when you were in my routes it kept defaulting back to the start of the route rather than letting you zoom in. My husband didn\u2019t have that issue on a Samsung phone."], ["Ian Bachelor", "Camino (Spain)", 5, "15 Jun", "Constructive", ["Itinerary & Route Info Accuracy", "Weather, Safety & Conditions"], "Perhaps a little more information on each day\u2019s walk, e.g distance and type of terrain to expect"], ["Sonia Ware", "Puglia (Italy)", 5, "15 Jun", "Positive", ["No improvement needed"], "Nothing"], ["Gerard Langtry", "Camino (Portugal)", 5, "15 Jun", "Constructive", ["App & Navigation", "Accommodation"], "The directions on the maps needs some more work. We needed to turn on roaming on our phone once to try and find our way to the accommodation."], ["Lyn Langtry", "Camino (Portugal)", 5, "15 Jun", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation"], "Location of hotels in relation to towns could be better. Maybe one out of town but not three. Also route maps could be better."], ["Matthew Gibney", "Camino (Spain)", 4, "14 Jun", "Constructive", ["Accommodation"], "See above. Accommodation after the first day in the hostel will need improvement."], ["James Kerin", "Camino (Spain)", 5, "13 Jun", "Positive", ["No improvement needed"], "No"], ["David Leadbetter", "Camino (Portugal)", 5, "13 Jun", "Positive", ["No improvement needed"], "No"], ["Marion Hailes-MacDonald", "UK (South West Coast Path)", 5, "13 Jun", "Positive", ["No improvement needed"], "No ...everything worked as planned."], ["Neil McDermott", "UK (Coast to Coast)", 5, "12 Jun", "Constructive", ["Other / General"], "See comments above."], ["Czek Kersevani", "Camino (Spain)", 5, "12 Jun", "Constructive", ["Accommodation", "Luggage & Transfers"], "No, luggage transfer were excellent, accommodation was varied but great."], ["Michael (Mick) Connellan", "Slovenia", 4, "12 Jun", "Constructive", ["Other / General"], "Just as mentioned above."], ["Cath Gibney", "Slovenia", 5, "11 Jun", "Constructive", ["App & Navigation"], "The Ride with GPS app will only allow about 10 maps downloaded. After that it asks you to start paying, or at least do 7 day \" free trial\" , even when accessed through the travel app. This happened to all of us."], ["Annette Gilmour", "Camino (Spain)", 5, "11 Jun", "Constructive", ["Weather, Safety & Conditions"], "If the weather had got any hotter I\u2019d recommend clients over 50yrs to keep the km under 20 EVERY day."], ["May Ngui", "UK (South West Coast Path)", 5, "10 Jun", "Constructive", ["App & Navigation"], "Need to make a few improvements to the app such as emphasizing decision points, should have voice notifications at decision points rather than having to look at the screen all the time"], ["Robyn Eastgate", "Kumano Kodo (Japan)", 5, "10 Jun", "Negative", ["App & Navigation"], "The map was at times confusing to me."], ["Joanne Leamy", "Michinoku Coastal Trail (Japan)", 4, "10 Jun", "Constructive", ["App & Navigation", "Accommodation", "Local Support & Communication", "Guides & Group", "Luggage & Transfers"], "Advise walkers in the app that the bus picks up from the hotel.  I did not refer to the pamphlet we were given as had been advised to use the app.  Also, put self guided walkers in contact with each other to make it easy to meet up."], ["Susan Burns", "Camino (Spain)", 5, "09 Jun", "Positive", ["No improvement needed"], "No"], ["Sue Fower", "Camino (Spain)", 5, "08 Jun", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy"], "I think recommending local apps such as Gronze would be better than Raw app for route guidance."], ["Carole Bain", "Camino (Portugal)", 5, "06 Jun", "Constructive", ["Itinerary & Route Info Accuracy"], "It would be good if the walk info matched our daily route"], ["Maryann McBean", "Camino (Portugal)", 5, "05 Jun", "Constructive", ["App & Navigation", "Itinerary & Route Info Accuracy", "Accommodation"], "The app needed constant reloading every time I wanted to reference it- I feel gold standard would be that once the itinerary is loaded it should stay loaded"], ["Bryony Stevens", "Camino (Spain)", 5, "05 Jun", "Positive", ["No improvement needed"], "No"], ["Alison Jennings", "Puglia (Italy)", 5, "05 Jun", "Positive", ["No improvement needed"], "No"], ["Junko Asaba", "Nakasendo Way (Japan)", 5, "04 Jun", "Negative", ["Local Support & Communication"], "There are two clock towers at the meeting
